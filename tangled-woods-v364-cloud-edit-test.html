.ped{display:flex;gap:10px;overflow-x:auto;align-items:stretch}.pedcol{flex:1;min-width:170px}.pednode{background:white;border:1px solid #dce6dc;border-radius:10px;padding:9px;margin:7px 0;min-height:48px;overflow-wrap:anywhere}.pednode strong{font-size:12px;display:block}.pednode small{font-size:10px;display:block;color:#66776a}.pednode.ambiguous{border-color:#d3a148}.pednode.unmatched{border-style:dashed}.pednode.unknown{opacity:.55}.stat{padding:12px;background:#f3f7f1;border-radius:12px}.stat strong{display:block;font-size:23px;color:#315d4b} @media print{.no-print{display:none!important}footer{display:none!important}body{background:white}.ped{overflow:visible;gap:4px}.pedcol{min-width:0}.pednode{padding:3px;margin:3px 0;min-height:0;break-inside:avoid}.pednode strong{font-size:8px}.pednode small{font-size:7px} .pedcol h3{font-size:10px}main{padding:0}.card{box-shadow:none}}

</style></head><body><header class="brand-header"><img class="brand-logo" src="tangled-woods-logo.jpg" alt="Tangled Woods Rabbitry logo"><div><small>TANGLED WOODS</small><h1>Rabbitry Manager</h1><small>Private breeding & pedigree records</small></div></header><main><div class="tabs" id="tabs"></div><section id="view"></section></main><footer>Version 3.3 · Local records · No automatic sync</footer><script src="seed.js"></script><script>
const KEY='tangledwoods-data-v2';let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(SEED)}catch(e){db=structuredClone(SEED)};if(!Array.isArray(db.breedings))db.breedings=[];if(!db.parentLinks||typeof db.parentLinks!=='object')db.parentLinks={};let page='Home',query='',selected=null;const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const name=r=>[r.Prefix,r.Name].filter(Boolean).join(' ');const options=['Home','Rabbits','Litters','Breeding','Pedigrees','Import','Backup'];const el=id=>document.getElementById(id);function nav(p){page=p;selected=null;query='';render()}function render(){el('tabs').innerHTML=options.map(x=>`<button class="${page===x?'active':''}" onclick="nav('${x}')">${x}</button>`).join('');let v=el('view');if(page==='Home')v.innerHTML=`<h2>Welcome back</h2><div class="stats"><div class="card stat"><strong>${db.rabbits.length}</strong>Rabbit records</div><div class="card stat"><strong>${db.litters.length}</strong>Litters</div><div class="card stat"><strong>${db.rabbits.filter(x=>x.Sex?.toLowerCase()==='doe').length}</strong>Does</div><div class="card stat"><strong>${db.rabbits.filter(x=>x.Sex?.toLowerCase()==='buck').length}</strong>Bucks</div></div><div class="card"><h3>Quick actions</h3><button class="primary" onclick="nav('Rabbits')">Browse rabbits</button> <button onclick="nav('Breeding')">Breeding planner</button> <button onclick="nav('Litters')">View litters</button></div><div class="card"><h3>Migration status</h3><p>Import your Everbreed CSV files from the Import tab. Pedigree links are matched by name only where unambiguous. Unmatched ancestors need manual verification. Device syncing is not enabled.</p></div>`;
if(page==='Breeding')breeding();if(page==='Rabbits')listing('rabbits');if(page==='Litters')listing('litters');if(page==='Pedigrees')v.innerHTML=`<h2>Pedigree viewer</h2><p class="muted">Choose a rabbit to view its parents and known ancestors. Names that cannot be matched remain as text.</p><input id="search" placeholder="Search rabbit name or tattoo" oninput="filterPed(this.value)"><div id="results"></div>`;if(page==='Pedigrees')filterPed('');if(page==='Import')v.innerHTML=`<h2>Import Everbreed CSV</h2><div class="card"><p>Choose an Everbreed <strong>Rabbits/Breeders</strong> or <strong>Litters</strong> CSV. The file is read on this device only; it is not uploaded to GitHub or a server.</p><label>Import type<select id="importType" onchange="if(el('importFile').files.length)previewCSV()"><option value="rabbits">Rabbits / Breeders</option><option value="litters">Litters</option></select></label><label>Choose CSV<input id="importFile" type="file" accept=".csv,text/csv" onchange="previewCSV()"></label><div id="importPreview" class="muted">Select a file to preview it before importing.</div></div><div class="card"><h3>Before importing</h3><p>Use Backup → Download backup first. Import replaces records of the selected type on this device; the other type remains unchanged. Existing edits in that category will be replaced.</p><p class="muted">No cloud syncing yet. Repeat import on another device if needed, or transfer a JSON backup.</p></div>`;
if(page==='Backup')v.innerHTML=`<h2>Data & backups</h2><div class="card"><p>Export a complete JSON backup after edits. Store it somewhere safe, such as Files or iCloud Drive.</p><button class="primary" onclick="backup()">Download backup</button><h3>Restore backup</h3><input type="file" accept="application/json,.json" onchange="restore(event)"><p class="muted">Restoring replaces all current records on this device.</p></div><div class="card"><h3>Important</h3><p>This prototype saves data in this browser. Clearing website data may erase changes. iPhone and iPad do not sync yet.</p></div>`;}
function listing(type){let isR=type==='rabbits';el('view').innerHTML=`<div class="row"><h2>${isR?'Rabbits':'Litters'}</h2><button class="primary" onclick="edit('${type}',-1)">+ Add</button></div><input id="search" placeholder="Search by name, breed, tattoo, parent..." value="${esc(query)}" oninput="filterList('${type}',this.value)"><div class="muted" id="count"></div><div id="results"></div>`;filterList(type,query)}function filterList(type,q){query=q;let a=db[type].map((x,i)=>({...x,__index:i})).filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(q.toLowerCase())));el('count').textContent=`${a.length} matching records`;el('results').innerHTML=a.slice(0,100).map(x=>`<button class="listitem" onclick="detail('${type}',${x.__index})"><strong>${esc(name(x)||'Unnamed')}</strong><span class="muted">${esc(x.Breed||'')} · ${esc(type==='rabbits'?x.Tattoo||x.Sex:x.Born||x.Bred)} · ${esc(type==='rabbits'?x.Status:x['Total Kits']+' kits')}</span></button>`).join('')+(a.length>100?'<p class="muted">Showing first 100 results; narrow your search.</p>':'')}
function detail(type,i){let x=db[type][i];selected={type,i};el('view').innerHTML=`<button onclick="render()">← Back</button><div class="card"><div class="row"><h2>${esc(name(x)||'Unnamed')}</h2><button onclick="edit('${type}',${i})">Edit</button></div>${Object.entries(x).filter(([k,v])=>!k.startsWith('_')&&v).map(([k,v])=>`<p><span class="muted">${esc(k)}:</span> ${esc(v)}</p>`).join('')}${type==='rabbits'?`<button class="primary" onclick="pedigree(${i})">View pedigree</button>`:''}</div>`}
function edit(type,i){let x=i<0?{}:db[type][i];let keys=type==='rabbits'?['Prefix','Name','Sex','Tattoo','Breed','Color','DoB','Father','Mother','Weight','Status','Notes']:['Prefix','Name','Breed','Father','Mother','Bred','Born','Total Kits','Sold Kits','Died Kits','Notes'];el('view').innerHTML=`<button onclick="render()">← Cancel</button><h2>${i<0?'Add':'Edit'} ${type==='rabbits'?'rabbit':'litter'}</h2><form id="editform">${keys.map(k=>`<label>${esc(k)}${k==='Notes'?`<textarea name="${k}">${esc(x[k]||'')}</textarea>`:`<input name="${k}" value="${esc(x[k]||'')}">`}</label>`).join('')}<button class="primary" type="submit">Save record</button></form>`;el('editform').onsubmit=e=>{e.preventDefault();let data={...x};new FormData(e.target).forEach((v,k)=>data[k]=v);if(i<0){data._id=(type==='rabbits'?'r':'l')+Date.now();db[type].push(data)}else db[type][i]=data;try{save();nav(type==='rabbits'?'Rabbits':'Litters')}catch(err){alert('Storage is full. Export a backup and use a hosted database.')}}}
function cleanParent(s){let t=String(s||'').trim();if(t.startsWith('[')){try{let a=JSON.parse(t);if(Array.isArray(a))t=a.join(' ')}catch(e){}}return t.replace(/\s*\([^)]*\)\s*$/,'').trim()}
function rabbitKey(r){return String(r._id||'')}function normParent(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function matchInfo(s,child,role){let raw=String(s||'').trim(),key=child&&rabbitKey(child)+'|'+role,override=key&&db.parentLinks[key];if(override){if(override.kind==='text')return {record:null,label:override.label||'Unknown',status:'manual'};let rec=db.rabbits.find(x=>rabbitKey(x)===override.id);if(rec)return {record:rec,label:name(rec),status:'verified'};return {record:null,label:raw||'Missing linked record',status:'unmatched'}}let t=cleanParent(raw);if(!t)return {record:null,label:'Unknown',status:'unknown'};let a=db.rabbits.filter(x=>normParent(name(x))===normParent(t));if(!a.length)a=db.rabbits.filter(x=>normParent(x.Name)===normParent(t));if(a.length===1)return {record:a[0],label:name(a[0]),status:'matched'};return {record:null,label:raw,status:a.length?'ambiguous':'unmatched'}}
function parentEditor(i){let root=db.rabbits[i];let fields=['Father','Mother'];el('view').innerHTML=`<button onclick="pedigree(${i})">← Back to pedigree</button><h2>Verify parents: ${esc(name(root))}</h2><div class="card"><p class="muted">Select a rabbit from your imported records or preserve an ancestor as text. This does not overwrite original Everbreed parent fields. A manual link will be used in pedigree trees and saved in JSON backups.</p><form id="parentForm">${fields.map(role=>{let current=db.parentLinks[rabbitKey(root)+'|'+role],info=matchInfo(root[role],root,role);let id=current?.kind==='record'?current.id:'';return `<label>${role} (original: ${esc(root[role]||'not recorded')})<select name="${role}Id"><option value="">— No linked rabbit; use text below —</option>${db.rabbits.filter(r=>rabbitKey(r)!==rabbitKey(root)&&String(r.Sex||'').toLowerCase()===(role==='Father'?'buck':'doe')).sort((a,b)=>name(a).localeCompare(name(b))).map(r=>`<option value="${esc(rabbitKey(r))}" ${id===rabbitKey(r)?'selected':''}>${esc(name(r))} · ${esc(r.Tattoo||'no tattoo')}</option>`).join('')}</select></label><label>${role} text when no rabbit is linked<input name="${role}Text" value="${esc(current?.kind==='text'?current.label:(root[role]||''))}"></label><p class="muted">Current result: ${esc(info.label)} (${esc(info.status)})</p>`}).join('')}<button class="primary" type="submit">Save parent corrections</button></form></div>`;el('parentForm').onsubmit=e=>{e.preventDefault();let data=new FormData(e.target),old=JSON.stringify(db.parentLinks);for(let role of fields){let id=String(data.get(role+'Id')||''),label=String(data.get(role+'Text')||'').trim(),key=rabbitKey(root)+'|'+role;if(id){let candidate=db.rabbits.find(r=>rabbitKey(r)===id);if(!candidate||id===rabbitKey(root)){alert('Invalid parent selection');return}db.parentLinks[key]={kind:'record',id}}else if(label)db.parentLinks[key]={kind:'text',label};else delete db.parentLinks[key]}try{save();pedigree(i)}catch(err){db.parentLinks=JSON.parse(old);alert('Unable to save parent corrections. Export a backup and check storage.')}}}
function pedigree(i){let root=db.rabbits[i],gens=Number(window.pedGens||3);let nodes=[{record:root,label:name(root),status:'matched',path:0,level:0}];for(let depth=1;depth<gens;depth++){let prior=nodes.filter(n=>n.level===depth-1);for(let n of prior){for(let [idx,key] of ['Father','Mother'].entries()){let info=n.record?matchInfo(n.record[key],n.record,key):{record:null,label:'Unknown',status:'unknown'};nodes.push({...info,path:n.path*2+idx,level:depth})}}}let columns=[];for(let d=0;d<gens;d++){let group=nodes.filter(n=>n.level===d);columns.push(`<div class="pedcol"><h3>${['Rabbit','Parents','Grandparents','Great-grandparents','4th generation ancestors'][d]||'Ancestors'}</h3>${group.map(n=>`<div class="pednode ${n.status}"><strong>${esc(n.label||'Unknown')}</strong>${n.record?`<small>${esc(['Tattoo','Reg #','Color','Breed','Weight','DoB'].map(k=>n.record[k]?(k+': '+n.record[k]):'').filter(Boolean).join(' · '))}</small>`:''}${n.status!=='matched'&&n.status!=='verified'?`<small>${n.status==='ambiguous'?'⚠ Multiple possible matches':n.status==='unmatched'?'Not found in imported rabbits':n.status==='manual'?'Manually entered text':'Not recorded'}</small>`:''}${n.status==='verified'?'<small>Manually linked</small>':''}</div>`).join('')}</div>`)}let unverified=nodes.filter(n=>!['matched','verified'].includes(n.status)).length;el('view').innerHTML=`<button class="no-print" onclick="nav('Pedigrees')">← Pedigrees</button><div class="row"><h2>${esc(name(root))}</h2><button class="no-print" onclick="window.print()">Print / Save PDF</button></div><div class="no-print"><button onclick="parentEditor(${i})">Verify / correct parents</button><label>Generations <select onchange="window.pedGens=Number(this.value);pedigree(${i})"><option value="3" ${gens===3?'selected':''}>3 generations</option><option value="5" ${gens===5?'selected':''}>5 generations</option></select></label></div><div class="card"><div class="pedigree-brand"><img src="tangled-woods-logo.jpg" alt="Tangled Woods Rabbitry logo"><strong>Tangled Woods Rabbitry · Pedigree</strong></div><p>${esc(name(root))} · ${esc(root.Tattoo||'No tattoo')} · ${esc(root.Breed||'')} · ${esc(root.Color||'')}</p><p class="muted">${unverified} unresolved or text-only ancestor positions. Automatic name matches are not independently verified. Check all ancestor details against original pedigrees before issuing certificates.</p></div><div class="ped ped${gens}">${columns.join('')}</div><div class="card"><p>I certify that this pedigree is correct to the best of my knowledge.</p><p>Signature: _________________________ Date: _____________</p></div>`}
function parseDate(v){let s=String(v||'').trim(),m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m){let d=new Date(+m[3],+m[1]-1,+m[2]);return d.getFullYear()===+m[3]&&d.getMonth()===+m[1]-1&&d.getDate()===+m[2]?d:null}if(/^\d{4}-\d\d-\d\d$/.test(s)){let d=new Date(s+'T12:00:00');return Number.isNaN(+d)?null:d}return null}
function dateISO(d){let n=new Date(d);return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function rabbitChoices(sex){return db.rabbits.map((r,i)=>({r,i})).filter(y=>String(y.r.Sex||'').toLowerCase()===sex).map(y=>`<option value="${esc(y.r._id||'r-import-'+y.i)}">${esc(name(y.r)||'Unnamed')} · ${esc(y.r.Tattoo||'No tattoo')}</option>`).join('')}
function rabbitLabel(id){let r=db.rabbits.find((r,i)=>(r._id||'r-import-'+i)===id);return r?name(r):'Missing rabbit'}
function newBreeding(i=-1){let x=i<0?{}:db.breedings[i];el('view').innerHTML=`<button onclick="nav('Breeding')">← Cancel</button><h2>${i<0?'New':'Edit'} breeding</h2><div class="card"><p class="muted">Select the parents from imported records. This creates a breeding record, not a litter.</p><form id="breedForm"><label>Doe<select name="doeId" required><option value="">Choose doe…</option>${rabbitChoices('doe')}</select></label><label>Buck<select name="buckId" required><option value="">Choose buck…</option>${rabbitChoices('buck')}</select></label><label>Breeding date<input name="date" type="date" required value="${esc(x.date||dateISO(new Date()))}"></label><div class="card" id="duePreview" aria-live="polite"></div><label>Status<select name="status">${['Bred','Confirmed pregnant','Kindled','Unsuccessful','Cancelled'].map(v=>`<option value="${v}">${v}</option>`).join('')}</select></label><label>Actual kindling date (optional)<input name="kindledDate" type="date" value="${esc(x.kindledDate||'')}"></label><label>Notes<textarea name="notes">${esc(x.notes||'')}</textarea></label><button class="primary" type="submit">${i<0?'Save breeding':'Save changes'}</button></form></div>`;let f=el('breedForm');f.elements.doeId.value=x.doeId||'';f.elements.buckId.value=x.buckId||'';f.elements.status.value=x.status||'Bred';let update=()=>{let d=parseDate(f.elements.date.value);el('duePreview').textContent=d?'Estimated kindling: '+dateISO(addDays(d,31))+' (typical range '+dateISO(addDays(d,28))+'–'+dateISO(addDays(d,33))+')':'Select a breeding date'};f.elements.date.addEventListener('input',update);update();f.onsubmit=e=>{e.preventDefault();let z=Object.fromEntries(new FormData(f));if(!db.rabbits.some(r=>r._id===z.doeId&&String(r.Sex).toLowerCase()==='doe')||!db.rabbits.some(r=>r._id===z.buckId&&String(r.Sex).toLowerCase()==='buck')){alert('Choose a valid doe and buck');return}if(z.doeId===z.buckId){alert('Choose two different rabbits');return}let previous=JSON.stringify(db.breedings);let rec={...x,...z,_id:x._id||'b-'+Date.now()};if(i<0)db.breedings.push(rec);else db.breedings[i]=rec;try{save();nav('Breeding')}catch(err){db.breedings=JSON.parse(previous);alert('Could not save. Check device storage and export a backup.')}}}
function removeBreeding(i){if(!confirm('Delete this breeding record? This does not delete rabbits or litters.'))return;let old=db.breedings.slice();db.breedings.splice(i,1);try{save();nav('Breeding')}catch(e){db.breedings=old;alert('Could not delete: '+e.message)}}
function breeding(){let today=new Date();today.setHours(0,0,0,0);let active=db.breedings.map((x,i)=>({x,i,date:parseDate(x.date)})).filter(y=>y.date&&!['Kindled','Unsuccessful','Cancelled'].includes(y.x.status)&&!y.x.kindledDate).map(y=>({...y,due:addDays(y.date,31)})).sort((a,b)=>a.due-b.due);let upcoming=active.filter(y=>y.due>=today&&y.due<=addDays(today,45)),overdue=active.filter(y=>y.due<today);let recent=db.litters.map((x,i)=>({x,i,date:parseDate(x.Born)})).filter(y=>y.date).sort((a,b)=>b.date-a.date).slice(0,12);el('view').innerHTML=`<div class="row"><h2>Breeding planner</h2><button class="primary" onclick="newBreeding()">+ New breeding</button></div><div class="card"><h3>Kindling estimates</h3><p class="muted">Estimated 31 days after breeding (typical range 28–33 days). Confirm dates with your own records and veterinary guidance.</p><div class="stats"><div class="stat"><strong>${upcoming.length}</strong>Next 45 days</div><div class="stat"><strong>${overdue.length}</strong>Past estimated date</div><div class="stat"><strong>${db.breedings.length}</strong>Breeding records</div></div></div><h3>Upcoming expected kindling</h3>${upcoming.length?upcoming.map(y=>`<button class="listitem" onclick="newBreeding(${y.i})"><strong>${esc(rabbitLabel(y.x.doeId))} × ${esc(rabbitLabel(y.x.buckId))}</strong><span class="muted">Est. ${dateISO(y.due)} · ${esc(y.x.status)}</span></button>`).join(''):'<div class="card muted">No upcoming kindling dates recorded. Add a breeding to begin planning.</div>'}<h3>Breeding history</h3>${db.breedings.length?db.breedings.map((x,i)=>({x,i})).reverse().map(y=>`<div class="card"><strong>${esc(rabbitLabel(y.x.doeId))} × ${esc(rabbitLabel(y.x.buckId))}</strong><p class="muted">Bred ${esc(y.x.date)} · ${esc(y.x.status)}${y.x.kindledDate?' · Kindled '+esc(y.x.kindledDate):''}</p><button onclick="newBreeding(${y.i})">Edit</button> <button onclick="removeBreeding(${y.i})">Delete</button></div>`).join(''):'<p class="muted">No separate breeding records yet. Historical imported litters remain below.</p>'}<h3>Recent recorded litters</h3>${recent.map(y=>`<button class="listitem" onclick="detail('litters',${y.i})"><strong>${esc(name(y.x)||'Unnamed litter')}</strong><span class="muted">Born ${dateISO(y.date)} · ${esc(y.x['Total Kits']||'?')} kits</span></button>`).join('')||'<p>No recorded births yet.</p>'}<div class="card"><h3>Reminders</h3><p>Dates appear when the app opens. Push notifications and automatic device syncing are not enabled.</p></div>`}

<script id="tw-cloud-preview-script">
/* Read-only cloud preview: does not write to localStorage, IndexedDB, or Cloudflare. */
(function(){
  'use strict';
  options.push('Cloud Preview');
  const originalRenderCloud = render;
  let records = null, loading = false, error = '', category = 'rabbits', search = '', shown = 50;
  render = function(){
    originalRenderCloud();
    if(page === 'Cloud Preview') drawCloud();
  };
  function element(tag, text, cls){
    const e=document.createElement(tag);
    if(text!==undefined)e.textContent=String(text);
    if(cls)e.className=cls;
    return e;
  }
  async function loadCloud(){
    loading=true;error='';records=null;drawCloud();
    try{
      const [r,l]=await Promise.all(['rabbits','litters'].map(async type=>{
        const response=await fetch('/api/'+type,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});
        if(!response.ok)throw Error(type+' request returned HTTP '+response.status);
        const data=await response.json();
        if(!data || !Array.isArray(data[type]))throw Error(type+' response was not a record list');
        return data[type];
      }));
      records={rabbits:r,litters:l};
    }catch(e){error=e.message||String(e)}
    finally{loading=false;if(page==='Cloud Preview')drawCloud()}
  }
  function drawCloud(){
    const view=document.getElementById('view');
    if(!view||page!=='Cloud Preview')return;
    view.replaceChildren();
    view.append(element('h2','Cloud records preview (read-only)'));
    view.append(element('p','This tab reads Cloudflare records only. It does not replace, import, edit, or save any records on this device. Your existing local data and pedigree layouts remain unchanged.','tw-cloud-note'));
    const btn=element('button',loading?'Loading cloud records…':records?'Reload cloud records':'Load cloud records','primary');
    btn.type='button';btn.disabled=loading;btn.addEventListener('click',loadCloud);view.append(btn);
    if(loading){view.append(element('p','Loading rabbits and litters…'));return}
    if(error){view.append(element('p','Unable to load cloud records: '+error+' — check your Cloudflare login and try again.'));return}
    if(!records){view.append(element('p','Click Load cloud records to begin.','muted'));return}
    view.append(element('p',records.rabbits.length+' rabbits · '+records.litters.length+' litters retrieved from Cloudflare.'));
    const choices=document.createElement('div');choices.className='row';
    for(const type of ['rabbits','litters']){
      const b=element('button',type==='rabbits'?'Rabbits':'Litters',category===type?'primary':'');
      b.type='button';b.addEventListener('click',()=>{category=type;search='';shown=50;drawCloud()});choices.append(b)
    }
    view.append(choices);
    const field=element('input');field.type='search';field.placeholder='Search '+category+' by name, tattoo, parent, or other field';field.value=search;
    view.append(field);
    const count=element('p','','muted');view.append(count);
    const list=document.createElement('div');view.append(list);
    const more=element('button','Show 50 more');more.type='button';view.append(more);
    function updateList(){
      const term=search.trim().toLowerCase();
      const matches=records[category].filter(x=>x&&typeof x==='object'&&(!term||Object.values(x).some(v=>String(v??'').toLowerCase().includes(term))));
      count.textContent=matches.length+' matching '+category+' · showing '+Math.min(shown,matches.length);
      list.replaceChildren();
      for(const x of matches.slice(0,shown)){
        const title=[x.Prefix,x.Name].filter(Boolean).join(' ')||x.Name||x._id||'Unnamed record';
        const summary=category==='rabbits'?[x.Breed,x.Sex,x.Tattoo]:[x.Born,x.Mother,x.Father];
        const button=element('button',undefined,'tw-cloud-item');button.type='button';
        button.append(element('strong',title),element('span',summary.filter(Boolean).join(' · '),'muted'));
        button.addEventListener('click',()=>{
          const existing=button.querySelector('.tw-cloud-fields');
          if(existing){existing.remove();return}
          const details=element('div',undefined,'tw-cloud-fields');
          for(const [key,val] of Object.entries(x)){
            if(key.startsWith('_')||val==null||val==='')continue;
            details.append(element('p',key+': '+(typeof val==='object'?JSON.stringify(val):String(val))));
          }
          button.append(details);
        });list.append(button);
      }
      more.hidden=shown>=matches.length;
    }
    field.addEventListener('input',()=>{search=field.value;shown=50;updateList()});
    more.addEventListener('click',()=>{shown+=50;updateList()});
    updateList();
  }
  render();
})();
</script>

<script id="tw-cloud-app-script">
/* Isolated TEST-001 cloud editing workspace. All other cloud editing remains blocked. */
(function(){
 'use strict';
 let cloudMode=false, cloudRecords=null, localDb=null, loading=false;
 // Read-only indicator of isolated cloud mode for the editor.
 window.twIsCloudTestMode = () => cloudMode;
 const baseRender=render, baseNav=nav;
 options.push('Cloud App');
 const originalEdit=edit, originalParentEditor=parentEditor, originalNewBreeding=newBreeding;
 const originalRemoveBreeding=removeBreeding, originalCommitCSV=commitCSV;
 const originalRestore=restore;
 const originalPhotoAdd=window.twAddPhoto, originalPhotoRemove=window.twRemovePhoto;
 const originalDetail=detail, originalPedigree=pedigree;
 const originalBackup=backup, originalPreviewCSV=previewCSV;
 function hideCloudEditing(){
   if(!cloudMode)return;
   const view=el('view');if(!view)return;
   for(const button of view.querySelectorAll('button')){
     const label=button.textContent.trim();
     if(['+ Add','Edit','Verify / correct parents','Remove photo','+ New breeding','Save record','Save parent corrections'].includes(label))button.remove();
   }
   for(const input of view.querySelectorAll('input[type="file"]'))input.remove();
   for(const label of view.querySelectorAll('label')){
     if(label.textContent.includes('Rabbit photograph'))label.remove();
   }
   const photoTools=view.querySelector('.tw-photo-tools');if(photoTools)photoTools.remove();
 }
 window.twAddPhoto=function(...args){if(cloudMode)return blocked();return originalPhotoAdd(...args)};
 window.twRemovePhoto=function(...args){if(cloudMode)return blocked();return originalPhotoRemove(...args)};
 detail=function(...args){
   const result=originalDetail(...args);hideCloudEditing();
   if(cloudMode && args[0]==='rabbits')el('view').dataset.twCloudTest='true';
   if(cloudMode && args[0]==='rabbits'){
     const rabbit=db.rabbits[args[1]];
     if(rabbit && rabbit._id==='TEST-001'){
       const card=el('view').querySelector('.card');
       if(card){
         const area=document.createElement('section');area.className='tw-cloud-app-banner no-print';
         const heading=document.createElement('h3');heading.textContent='Edit TEST-001 (test database only)';area.append(heading);
         const lbl=document.createElement('label');lbl.textContent='Rabbit name ';lbl.htmlFor='twTestName';area.append(lbl);
         const input=document.createElement('input');input.id='twTestName';input.type='text';input.maxLength=120;input.value=rabbit.Name||'';area.append(input);
         const btn=document.createElement('button');btn.type='button';btn.className='primary';btn.textContent='Save test rabbit';area.append(btn);
         const status=document.createElement('p');status.setAttribute('role','status');area.append(status);
         btn.onclick=async()=>{
           const newName=input.value.trim();
           if(!newName){status.textContent='Enter a name before saving.';return}
           if(!confirm('Save the TEST-001 name to the isolated test database?'))return;
           btn.disabled=true;status.textContent='Saving to test database…';
           try{
             const response=await fetch('/api/test-save-rabbit',{
               method:'POST',credentials:'same-origin',
               headers:{'Content-Type':'application/json','Accept':'application/json'},
               body:JSON.stringify({_id:'TEST-001',Name:newName})
             });
             const body=await response.json();
             if(!response.ok || body.saved!==true || body.rabbit?._id!=='TEST-001')throw Error(body.error||'Save not confirmed (HTTP '+response.status+')');
             const check=await fetch('/api/rabbits',{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});
             if(!check.ok)throw Error('Saved, but verification request failed (HTTP '+check.status+')');
             const verified=await check.json();
             const found=verified.rabbits?.find(x=>x._id==='TEST-001');
             if(!found || found.Name!==newName)throw Error('Saved, but the retrieved name did not match');
             db.rabbits[args[1]]=found;
             status.textContent='Saved and independently verified in test database: '+found.Name;
             // Keep the verified message visible; the full detail refreshes on next navigation.
           }catch(e){status.textContent='Save/verification issue: '+e.message}
           finally{btn.disabled=false}
         };
         card.append(area);
       }
     }
   }
   return result;
 };
 pedigree=function(...args){const result=originalPedigree(...args);hideCloudEditing();return result};
 backup=function(...args){if(cloudMode)return blocked();return originalBackup(...args)};
 previewCSV=function(...args){if(cloudMode)return blocked();return originalPreviewCSV(...args)};
 function blocked(){alert('Other editing features are disabled in this isolated cloud test workspace.');}
 edit=function(...args){if(cloudMode)return blocked();return originalEdit(...args)};
 parentEditor=function(...args){if(cloudMode)return blocked();return originalParentEditor(...args)};
 newBreeding=function(...args){if(cloudMode)return blocked();return originalNewBreeding(...args)};
 removeBreeding=function(...args){if(cloudMode)return blocked();return originalRemoveBreeding(...args)};
 commitCSV=function(...args){if(cloudMode)return blocked();return originalCommitCSV(...args)};
 restore=function(...args){if(cloudMode)return blocked();return originalRestore(...args)};
 function leaveCloud(){if(cloudMode){db=localDb;localDb=null;cloudMode=false}}
 nav=function(p){
   if(p==='Cloud App'){leaveCloud();page=p;selected=null;query='';render();return}
   if(cloudMode && !['Rabbits','Litters','Pedigrees'].includes(p))leaveCloud();
   return baseNav(p);
 };
 render=function(){
   delete el('view').dataset.twCloudTest;
   if(page==='Cloud App'&&!cloudMode){
     baseRender();
     const view=el('view');view.replaceChildren();
     const h=document.createElement('h2');h.textContent='Cloud App test (rabbit create and edit)';view.append(h);
     const note=document.createElement('p');note.className='tw-cloud-app-banner';note.textContent='Loads Cloudflare rabbits and litters into a temporary viewing workspace. No local records, cloud records, or photos are changed. Test rabbits can be created and edited here; other editing features remain blocked.';view.append(note);
     const b=document.createElement('button');b.className='primary';b.textContent=loading?'Loading…':'Open cloud records';b.disabled=loading;b.onclick=load;view.append(b);
     const status=document.createElement('p');status.id='twCloudAppStatus';view.append(status);
     return;
   }
   baseRender();
   if(cloudMode){
     const banner=document.createElement('div');banner.className='tw-cloud-app-banner no-print';
     const strong=document.createElement('strong');strong.textContent='CLOUD TEST — test rabbit create/edit — '+db.rabbits.length+' rabbits · '+db.litters.length+' litters';banner.append(strong);
     const line=document.createElement('div');
     for(const [label,target] of [['Rabbits','Rabbits'],['Litters','Litters'],['Pedigrees','Pedigrees'],['Exit cloud view','Cloud App']]){
       const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=()=>nav(target);line.append(b);
     }
     banner.append(line);el('view').prepend(banner);
     hideCloudEditing();
     for(const button of el('tabs').querySelectorAll('button')){
       if(!['Rabbits','Litters','Pedigrees','Cloud App'].includes(button.textContent))button.disabled=true;
     }
   }
 };
 async function load(){
   if(loading)return;loading=true;render();
   const status=el('twCloudAppStatus');if(status)status.textContent='Reading records from Cloudflare…';
   try{
     const [r,l]=await Promise.all(['rabbits','litters'].map(async type=>{
       const response=await fetch('/api/'+type,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});
       if(!response.ok)throw Error(type+' HTTP '+response.status);
       const json=await response.json();if(!Array.isArray(json[type]))throw Error('Invalid '+type+' response');return json[type];
     }));
     cloudRecords={rabbits:r,litters:l,breedings:[],parentLinks:{}};
     localDb=db;db=cloudRecords;cloudMode=true;page='Rabbits';query='';selected=null;
   }catch(e){const box=el('twCloudAppStatus');if(box)box.textContent='Cloud connection failed: '+e.message}
   finally{loading=false;render()}
 }
})();
</script>

<script id="tw-cloud-edit-any-test-rabbit">
/* Four-field editor for test rabbits, available only in the Cloud App workspace. */
(function () {
  'use strict';
  const fields = ['Name', 'Sex', 'Breed', 'Status'];
  const previousDetail = detail;

  detail = function (type, index) {
    const result = previousDetail(type, index);
    if (type !== 'rabbits') return result;
    const rabbit = db.rabbits[index];
    const isCloudDetail = window.twIsCloudTestMode?.() === true;
    if (!isCloudDetail ||
        !rabbit || !/^TEST-(?:001|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i.test(rabbit._id || '')) return result;

    const card = document.querySelector('#view > .card');
    if (!card) return result;
    // Remove the legacy TEST-001 name-only editor, including its save handler.
    for (const old of card.querySelectorAll('section.tw-cloud-app-banner')) old.remove();

    const panel = document.createElement('section');
    panel.className = 'tw-cloud-app-banner no-print';
    const heading = document.createElement('h3');
    heading.textContent = 'Edit rabbit — TEST DATABASE ONLY';
    panel.append(heading);
    const form = document.createElement('form');
    const inputs = {};
    const expected = {};
    for (const key of fields) {
      expected[key] = String(rabbit[key] ?? '');
      const label = document.createElement('label');
      label.textContent = key;
      const input = key === 'Sex' ? document.createElement('select') : document.createElement('input');
      if (key === 'Sex') {
        for (const value of ['Buck', 'Doe']) {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = value;
          input.append(option);
        }
      } else {
        input.type = 'text';
        input.maxLength = 100;
      }
      input.name = key;
      input.value = expected[key];
      input.required = key === 'Name' || key === 'Sex';
      label.append(input);
      form.append(label);
      inputs[key] = input;
    }
    const saveButton = document.createElement('button');
    saveButton.type = 'submit';
    saveButton.className = 'primary';
    saveButton.textContent = 'Save test rabbit';
    const status = document.createElement('p');
    status.setAttribute('role', 'status');
    form.append(saveButton, status);
    panel.append(form);
    card.append(panel);

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const changes = Object.fromEntries(fields.map(key => [key, inputs[key].value.trim()]));
      if (!changes.Name || !['Buck', 'Doe'].includes(changes.Sex)) {
        status.textContent = 'Enter a name and select Buck or Doe.';
        return;
      }
      if (!confirm('Save changes to ' + rabbit._id + ' in the TEST database?')) return;
      saveButton.disabled = true;
      status.textContent = 'Saving to test database…';
      let saved = false;
      try {
        const response = await fetch('/api/test-save-rabbit', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({ _id: rabbit._id, ...changes, expected })
        });
        const body = await response.json();
        if (!response.ok || body.saved !== true || body.rabbit?._id !== rabbit._id)
          throw Error(body.error || 'Save not confirmed (HTTP ' + response.status + ').');
        saved = true;
        const check = await fetch('/api/rabbits', {
          credentials: 'same-origin', cache: 'no-store',
          headers: { Accept: 'application/json' }
        });
        if (!check.ok) throw Error('Verification request failed (HTTP ' + check.status + ').');
        const data = await check.json();
        const verified = data.rabbits?.find(r => r._id === rabbit._id);
        if (!verified || fields.some(key => String(verified[key] ?? '') !== changes[key]))
          throw Error('Saved values did not match the database verification.');
        db.rabbits[index] = verified;
        for (const key of fields) expected[key] = String(verified[key] ?? '');
        status.textContent = 'Saved and verified: ' + verified.Name + '. Return to the rabbit list to see updated details.';
      } catch (error) {
        status.textContent = (saved ? 'Save may have succeeded; reload cloud records before retrying. ' : 'Save issue: ') + error.message;
      } finally {
        saveButton.disabled = false;
      }
    });
    return result;
  };
})();
</script>

<script id="tw-test-create-rabbit-ui">
/* Add new rabbits only inside the isolated Cloud App test workspace. */
(function () {
  'use strict';
  const priorRender = render;
  const fields = ['Name', 'Sex', 'Breed', 'Status'];

  function isCloudTestView() {
    const banner = document.querySelector('#view > .tw-cloud-app-banner');
    return page === 'Rabbits' && !!banner &&
      banner.textContent.includes('CLOUD TEST') &&
      db && Array.isArray(db.rabbits);
  }

  function showCreateForm() {
    if (!isCloudTestView()) return;
    const view = el('view');
    view.replaceChildren();
    const back = document.createElement('button');
    back.type = 'button';
    back.textContent = '← Back to cloud rabbits';
    back.onclick = () => nav('Rabbits');
    view.append(back);

    const title = document.createElement('h2');
    title.textContent = 'Add rabbit — TEST DATABASE ONLY';
    view.append(title);
    const note = document.createElement('p');
    note.className = 'tw-cloud-app-banner';
    note.textContent = 'Creates one new rabbit in the isolated test database. No local records or production records will be changed.';
    view.append(note);

    const form = document.createElement('form');
    const controls = {};
    for (const field of fields) {
      const label = document.createElement('label');
      label.textContent = field;
      let input;
      if (field === 'Sex') {
        input = document.createElement('select');
        for (const [value, text] of [['', 'Choose Buck or Doe'], ['Buck', 'Buck'], ['Doe', 'Doe']]) {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = text;
          input.append(option);
        }
      } else {
        input = document.createElement('input');
        input.type = 'text';
        input.maxLength = 100;
      }
      input.name = field;
      input.required = field === 'Name' || field === 'Sex';
      label.append(input);
      form.append(label);
      controls[field] = input;
    }
    const submit = document.createElement('button');
    submit.type = 'submit';
    submit.className = 'primary';
    submit.textContent = 'Create test rabbit';
    form.append(submit);
    const status = document.createElement('p');
    status.setAttribute('role', 'status');
    form.append(status);
    view.append(form);

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const values = Object.fromEntries(fields.map(field => [field, controls[field].value.trim()]));
      if (!values.Name || !['Buck', 'Doe'].includes(values.Sex)) {
        status.textContent = 'Enter a name and choose Buck or Doe.';
        return;
      }
      if (!confirm('Create ' + values.Name + ' in the TEST database?')) return;
      submit.disabled = true;
      status.textContent = 'Creating rabbit in test database…';
      let createdId = null;
      try {
        const response = await fetch('/api/test-create-rabbit', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(values)
        });
        const result = await response.json();
        if (!response.ok || result.created !== true ||
            typeof result.rabbit?._id !== 'string' ||
            !result.rabbit._id.startsWith('TEST-')) {
          throw new Error(result.error || 'Creation was not confirmed.');
        }
        createdId = result.rabbit._id;
        status.textContent = 'Created. Checking the saved record…';
        const check = await fetch('/api/rabbits', {
          credentials: 'same-origin', cache: 'no-store',
          headers: { Accept: 'application/json' }
        });
        if (!check.ok) throw new Error('Verification request failed.');
        const data = await check.json();
        if (!Array.isArray(data.rabbits)) throw new Error('Invalid verification response.');
        const verified = data.rabbits.find(r => r._id === createdId);
        if (!verified || fields.some(field => String(verified[field] ?? '') !== values[field])) {
          throw new Error('Saved rabbit did not match the submitted fields.');
        }
        db.rabbits = data.rabbits;
        status.textContent = 'Created and verified: ' + verified.Name + ' (' + createdId + ').';
        form.querySelectorAll('input, select').forEach(control => control.disabled = true);
        submit.textContent = 'Rabbit created';
      } catch (error) {
        status.textContent = (createdId ? 'Rabbit may have been created. Do not retry yet; reload cloud records first. ' : 'Creation failed: ') + error.message;
        submit.disabled = !!createdId;
      }
    });
  }

  render = function (...args) {
    const result = priorRender(...args);
    if (isCloudTestView()) {
      const banner = document.querySelector('#view > .tw-cloud-app-banner');
      if (banner && !document.getElementById('twCreateTestRabbit')) {
        const button = document.createElement('button');
        button.id = 'twCreateTestRabbit';
        button.type = 'button';
        button.className = 'primary';
        button.textContent = '+ Add test rabbit';
        button.onclick = showCreateForm;
        banner.append(button);
      }
    }
    return result;
  };
})();
</script>
