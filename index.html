:root{font-family:system-ui,-apple-system,sans-serif;color:#263b32;background:#f6f5f0}*{box-sizing:border-box}body{margin:0}header{background:#315d4b;color:white;padding:20px max(18px,env(safe-area-inset-left));}header h1{font-size:22px;margin:4px 0}header small{opacity:.8}main{max-width:900px;margin:auto;padding:18px 16px 90px}.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0}.tabs button{white-space:nowrap}.tabs button.active{background:#315d4b;color:white}button,.btn{border:0;border-radius:12px;padding:11px 15px;background:#e5eae5;color:#263b32;font-size:15px;cursor:pointer}button.primary{background:#315d4b;color:white}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:white;border:1px solid #e5e9e3;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 6px #00000005}.stat strong{display:block;font-size:28px;color:#315d4b}.muted{color:#6d7b73;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.listitem{width:100%;text-align:left;background:white;border:1px solid #e1e6df;margin:5px 0;padding:14px;border-radius:12px}.listitem strong{display:block}input,select,textarea{width:100%;font:inherit;border:1px solid #cdd8cf;border-radius:10px;padding:12px;margin:5px 0 13px;background:white}label{display:block;font-size:13px;color:#53695b}h2{font-size:21px}h3{font-size:16px}.pill{background:#e8f1e9;border-radius:20px;padding:4px 8px;font-size:12px}.ped{display:grid;grid-template-columns:repeat(4,minmax(125px,1fr));gap:8px;overflow:auto}.ped .card{font-size:12px;padding:10px;min-width:125px}.ped .card strong{display:block}footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;padding:8px;text-align:center;color:#667;font-size:12px}#view{min-height:55vh}@media(min-width:650px){.stats{grid-template-columns:repeat(4,1fr)}}@media print{header,.tabs,footer,button{display:none!important}main{max-width:none}.ped{overflow:visible}}

.tw-kit-weight-entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:end;margin:12px 0;padding:10px;border:1px solid #d6d6d6;border-radius:9px}

.tw-kit-weight-entry .tw-weight-pair label{min-width:0}

@media(max-width:430px){.tw-kit-weight-entry{grid-template-columns:minmax(0,1fr)}.tw-kit-weight-entry > button{justify-self:start}}
.tabs{flex-wrap:wrap;overflow:visible;align-items:stretch}
.tabs button{flex:1 1 120px;min-width:0}
@media(min-width:1024px){

}
@media(max-width:600px){
  .tabs{gap:6px;padding:10px 0}

}

const KEY='tangledwoods-data-v2';let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(SEED)}catch(e){db=structuredClone(SEED)};if(!Array.isArray(db.breedings))db.breedings=[];if(!db.parentLinks||typeof db.parentLinks!=='object')db.parentLinks={};let page='Home',query='',selected=null;const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const name=r=>[r.Prefix,r.Name].filter(Boolean).join(' ');const options=['Home','Rabbits','Litters','Breeding','Pedigrees','Import','Backup'];const el=id=>document.getElementById(id);function nav(p){page=p;selected=null;query='';render()}function render(){el('tabs').innerHTML=options.map(x=>`<button class="${page===x?'active':''}" onclick="nav('${x}')">${x}</button>`).join('');let v=el('view');if(page==='Home')v.innerHTML=`<h2>Welcome back</h2><div class="stats"><div class="card stat"><strong>${db.rabbits.length}</strong>Rabbit records</div><div class="card stat"><strong>${db.litters.length}</strong>Litters</div><div class="card stat"><strong>${db.rabbits.filter(x=>x.Sex?.toLowerCase()==='doe').length}</strong>Does</div><div class="card stat"><strong>${db.rabbits.filter(x=>x.Sex?.toLowerCase()==='buck').length}</strong>Bucks</div></div><div class="card"><h3>Quick actions</h3><button class="primary" onclick="nav('Rabbits')">Browse rabbits</button> <button onclick="nav('Breeding')">Breeding planner</button> <button onclick="nav('Litters')">View litters</button></div><div class="card"><h3>Migration status</h3><p>Import your Everbreed CSV files from the Import tab. Pedigree links are matched by name only where unambiguous. Unmatched ancestors need manual verification. Device syncing is not enabled.</p></div>`;
if(page==='Breeding')breeding();if(page==='Rabbits')listing('rabbits');if(page==='Litters')listing('litters');if(page==='Pedigrees')v.innerHTML=`<h2>Pedigree viewer</h2><p class="muted">Choose a rabbit to view its parents and known ancestors. Names that cannot be matched remain as text.</p><input id="search" placeholder="Search rabbit name or tattoo" oninput="filterPed(this.value)"><div id="results"></div>`;if(page==='Pedigrees')filterPed('');if(page==='Import')v.innerHTML=`<h2>Import Everbreed CSV</h2><div class="card"><p>Choose an Everbreed <strong>Rabbits/Breeders</strong> or <strong>Litters</strong> CSV. The file is read on this device only; it is not uploaded to GitHub or a server.</p><label>Import type<select id="importType" onchange="if(el('importFile').files.length)previewCSV()"><option value="rabbits">Rabbits / Breeders</option><option value="litters">Litters</option></select></label><label>Choose CSV<input id="importFile" type="file" accept=".csv,text/csv" onchange="previewCSV()"></label><div id="importPreview" class="muted">Select a file to preview it before importing.</div></div><div class="card"><h3>Before importing</h3><p>Use Backup → Download backup first. Import replaces records of the selected type on this device; the other type remains unchanged. Existing edits in that category will be replaced.</p><p class="muted">No cloud syncing yet. Repeat import on another device if needed, or transfer a JSON backup.</p></div>`;
if(page==='Backup')v.innerHTML=`<h2>Data & backups</h2><div class="card"><p>Export a complete JSON backup after edits. Store it somewhere safe, such as Files or iCloud Drive.</p><button class="primary" onclick="backup()">Download backup</button><h3>Restore backup</h3><input type="file" accept="application/json,.json" onchange="restore(event)"><p class="muted">Restoring replaces all current records on this device.</p></div><div class="card"><h3>Important</h3><p>This prototype saves data in this browser. Clearing website data may erase changes. iPhone and iPad do not sync yet.</p></div>`;}
function listing(type){let isR=type==='rabbits';el('view').innerHTML=`<div class="row"><h2>${isR?'Rabbits':'Litters'}</h2><button class="primary" onclick="edit('${type}',-1)">+ Add</button></div><input id="search" placeholder="Search by name, breed, tattoo, parent..." value="${esc(query)}" oninput="filterList('${type}',this.value)"><div class="muted" id="count"></div><div id="results"></div>`;filterList(type,query)}function filterList(type,q){query=q;let a=db[type].map((x,i)=>({...x,__index:i})).filter(x =>
  (type !== 'rabbits' ||
  (window.twIsCloudTestMode?.() === true
    ? (
        window.twCloudRabbitArchiveFilter === 'all' ||
        (window.twCloudRabbitArchiveFilter === 'archived'
          ? x.Archived === true
          : x.Archived !== true)
      )
    : x.Archived !== true
  )
) &&
  Object.values(x).some(v =>
    String(v).toLowerCase().includes(q.toLowerCase())
  )
);el('count').textContent=`${a.length} matching records`;el('results').innerHTML=a.slice(0,100).map(x=>`<button class="listitem" onclick="detail('${type}',${x.__index})"><strong>${esc(name(x)||'Unnamed')}</strong><span class="muted">${esc(x.Breed||'')} · ${esc(type==='rabbits'?x.Tattoo||x.Sex:x.Born||x.Bred)} · ${esc(type==='rabbits'?x.Status:x['Total Kits']??'—')} kits</span></button>`).join('')+(a.length>100?'<p class="muted">Showing first 100 results; narrow your search.</p>':'')}
function twProfileValue(value){
 if(value===null||value===undefined||value==='')return '';
 if(Array.isArray(value))return value.map(twProfileValue).filter(Boolean).join(', ');
 if(typeof value==='object'){
   return Object.entries(value).filter(([k,v])=>!k.startsWith('_')&&v!==null&&v!==undefined&&v!=='').map(([k,v])=>`${k}: ${twProfileValue(v)}`).join(' · ');
 }
 return String(value);
}
function detail(type,i){
 let x=db[type][i];if(!x)return render();selected={type,i};
 const primary=['Prefix','Name','Sex','Tattoo','Breed','Color','DoB','Father','Mother','Weight','Status','Notes'];
 const fields=type==='rabbits'?[...primary.filter(k=>k in x),...Object.keys(x).filter(k=>!primary.includes(k)&&!['sale','transport','kitMilestones','kitReservation'].includes(k))]:Object.keys(x);
 const rows=fields.filter(k=>!k.startsWith('_')&&x[k]!==null&&x[k]!==undefined&&x[k]!==''&&(!Array.isArray(x[k])||x[k].length)).map(k=>{
   const value=twProfileValue(x[k]);return value?`<p><span class="muted">${esc(k)}:</span> ${esc(value)}</p>`:'';
 }).join('');
 el('view').innerHTML=`<button onclick="render()">← Back to ${type==='rabbits'?'rabbits':'litters'}</button><div class="card"><div class="row"><h2>${esc(name(x)||'Unnamed')}</h2><button class="primary" onclick="edit('${type}',${i})">Edit ${type==='rabbits'?'Rabbit':'Litter'}</button></div>${rows||'<p class="muted">No details recorded yet.</p>'}${type==='rabbits'?`<button onclick="pedigree(${i})">View pedigree</button>`:''}</div>`;
}

function edit(type,i){let x=i<0?{}:db[type][i];let keys=type==='rabbits'?['Prefix','Name','Sex','Tattoo','Breed','Color','DoB','Father','Mother','Weight','Status','Notes']:['Prefix','Name','Breed','Father','Mother','Bred','Born','Total Kits','Sold Kits','Died Kits','Notes'];el('view').innerHTML=`<button onclick="render()">← Cancel</button><h2>${i<0?'Add':'Edit'} ${type==='rabbits'?'rabbit':'litter'}</h2><form id="editform">${keys.map(k=>`<label>${esc(k)}${k==='Notes'?`<textarea name="${k}">${esc(x[k]||'')}</textarea>`:`<input name="${k}" value="${esc(x[k]||'')}">`}</label>`).join('')}<button class="primary" type="submit">Save record</button></form>`;el('editform').onsubmit=e=>{e.preventDefault();let data={...x};new FormData(e.target).forEach((v,k)=>data[k]=v);if(i<0){data._id=(type==='rabbits'?'r':'l')+Date.now();db[type].push(data)}else db[type][i]=data;try{save();if(i>=0)detail(type,i);else detail(type,db[type].length-1)}catch(err){alert('Storage is full. Export a backup and use a hosted database.')}}}
function cleanParent(s){let t=String(s||'').trim();if(t.startsWith('[')){try{let a=JSON.parse(t);if(Array.isArray(a))t=a.join(' ')}catch(e){}}return t.replace(/\s*\([^)]*\)\s*$/,'').trim()}
function rabbitKey(r){return String(r._id||'')}function normParent(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function matchInfo(s,child,role){let raw=String(s||'').trim(),key=child&&rabbitKey(child)+'|'+role,override=key&&db.parentLinks[key];if(override){if(override.kind==='text')return {record:null,label:override.label||'Unknown',status:'manual'};let rec=db.rabbits.find(x=>rabbitKey(x)===override.id);if(rec)return {record:rec,label:name(rec),status:'verified'};return {record:null,label:raw||'Missing linked record',status:'unmatched'}}let t=cleanParent(raw);if(!t)return {record:null,label:'Unknown',status:'unknown'};let a=db.rabbits.filter(x=>normParent(name(x))===normParent(t));if(!a.length)a=db.rabbits.filter(x=>normParent(x.Name)===normParent(t));if(a.length===1)return {record:a[0],label:name(a[0]),status:'matched'};return {record:null,label:raw,status:a.length?'ambiguous':'unmatched'}}
function parentEditor(i){let root=db.rabbits[i];let fields=['Father','Mother'];el('view').innerHTML=`<button onclick="pedigree(${i})">← Back to pedigree</button><h2>Verify parents: ${esc(name(root))}</h2><div class="card"><p class="muted">Select a rabbit from your imported records or preserve an ancestor as text. This does not overwrite original Everbreed parent fields. A manual link will be used in pedigree trees and saved in JSON backups.</p><form id="parentForm">${fields.map(role=>{let current=db.parentLinks[rabbitKey(root)+'|'+role],info=matchInfo(root[role],root,role);let id=current?.kind==='record'?current.id:'';return `<label>${role} (original: ${esc(root[role]||'not recorded')})<select name="${role}Id"><option value="">— No linked rabbit; use text below —</option>${db.rabbits.filter(r=>rabbitKey(r)!==rabbitKey(root)&&String(r.Sex||'').toLowerCase()===(role==='Father'?'buck':'doe')).sort((a,b)=>name(a).localeCompare(name(b))).map(r=>`<option value="${esc(rabbitKey(r))}" ${id===rabbitKey(r)?'selected':''}>${esc(name(r))} · ${esc(r.Tattoo||'no tattoo')}</option>`).join('')}</select></label><label>${role} text when no rabbit is linked<input name="${role}Text" value="${esc(current?.kind==='text'?current.label:(root[role]||''))}"></label><p class="muted">Current result: ${esc(info.label)} (${esc(info.status)})</p>`}).join('')}<button class="primary" type="submit">Save parent corrections</button></form></div>`;el('parentForm').onsubmit=e=>{e.preventDefault();let data=new FormData(e.target),old=JSON.stringify(db.parentLinks);for(let role of fields){let id=String(data.get(role+'Id')||''),label=String(data.get(role+'Text')||'').trim(),key=rabbitKey(root)+'|'+role;if(id){let candidate=db.rabbits.find(r=>rabbitKey(r)===id);if(!candidate||id===rabbitKey(root)){alert('Invalid parent selection');return}db.parentLinks[key]={kind:'record',id}}else if(label)db.parentLinks[key]={kind:'text',label};else delete db.parentLinks[key]}try{save();pedigree(i)}catch(err){db.parentLinks=JSON.parse(old);alert('Unable to save parent corrections. Export a backup and check storage.')}}}
function pedigree(i){let root=db.rabbits[i],gens=Number(window.pedGens||3);let nodes=[{record:root,label:name(root),status:'matched',path:0,level:0}];for(let depth=1;depth<gens;depth++){let prior=nodes.filter(n=>n.level===depth-1);for(let n of prior){for(let [idx,key] of ['Father','Mother'].entries()){let info=n.record?matchInfo(n.record[key],n.record,key):{record:null,label:'Unknown',status:'unknown'};nodes.push({...info,path:n.path*2+idx,level:depth})}}}let columns=[];for(let d=0;d<gens;d++){let group=nodes.filter(n=>n.level===d);columns.push(`<div class="pedcol"><h3>${['Rabbit','Parents','Grandparents','Great-grandparents','4th generation ancestors'][d]||'Ancestors'}</h3>${group.map(n=>`<div class="pednode ${n.status}"><strong>${esc(n.label||'Unknown')}</strong>${n.record?`<small>${esc(['Tattoo','Reg #','Color','Breed','Weight','DoB'].map(k=>n.record[k]?(k+': '+n.record[k]):'').filter(Boolean).join(' · '))}</small>`:''}${n.status!=='matched'&&n.status!=='verified'?`<small>${n.status==='ambiguous'?'⚠ Multiple possible matches':n.status==='unmatched'?'Not found in imported rabbits':n.status==='manual'?'Manually entered text':'Not recorded'}</small>`:''}${n.status==='verified'?'<small>Manually linked</small>':''}</div>`).join('')}</div>`)}let unverified=nodes.filter(n=>!['matched','verified'].includes(n.status)).length;el('view').innerHTML=`<button class="no-print" onclick="nav('Pedigrees')">← Pedigrees</button><div class="row"><h2>${esc(name(root))}</h2><button class="no-print" onclick="window.print()">Print / Save PDF</button></div><div class="no-print"><button onclick="parentEditor(${i})">Verify / correct parents</button><label>Generations <select onchange="window.pedGens=Number(this.value);pedigree(${i})"><option value="3" ${gens===3?'selected':''}>3 generations</option><option value="5" ${gens===5?'selected':''}>5 generations</option></select></label></div><div class="card"><div class="pedigree-brand"><img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD function parseDate(v){let s=String(v||'').trim(),m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m){let d=new Date(+m[3],+m[1]-1,+m[2]);return d.getFullYear()===+m[3]&&d.getMonth()===+m[1]-1&&d.getDate()===+m[2]?d:null}if(/^\d{4}-\d\d-\d\d$/.test(s)){let d=new Date(s+'T12:00:00');return Number.isNaN(+d)?null:d}return null}
function dateISO(d){let n=new Date(d);return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function rabbitChoices(sex){return db.rabbits.map((r,i)=>({r,i})).filter(y=>String(y.r.Sex||'').toLowerCase()===sex).map(y=>`<option value="${esc(y.r._id||'r-import-'+y.i)}">${esc(name(y.r)||'Unnamed')} · ${esc(y.r.Tattoo||'No tattoo')}</option>`).join('')}
function rabbitLabel(id){let r=db.rabbits.find((r,i)=>(r._id||'r-import-'+i)===id);return r?name(r):'Missing rabbit'}
function newBreeding(i=-1){let x=i<0?{}:db.breedings[i];el('view').innerHTML=`<button onclick="nav('Breeding')">← Cancel</button><h2>${i<0?'New':'Edit'} breeding</h2><div class="card"><p class="muted">Select the parents from imported records. This creates a breeding record, not a litter.</p><form id="breedForm"><label>Doe<select name="doeId" required><option value="">Choose doe…</option>${rabbitChoices('doe')}</select></label><label>Buck<select name="buckId" required><option value="">Choose buck…</option>${rabbitChoices('buck')}</select></label><label>Breeding date<input name="date" type="date" required value="${esc(x.date||dateISO(new Date()))}"></label><div class="card" id="duePreview" aria-live="polite"></div><label>Status<select name="status">${['Bred','Confirmed pregnant','Kindled','Unsuccessful','Cancelled'].map(v=>`<option value="${v}">${v}</option>`).join('')}</select></label><label>Actual kindling date (optional)<input name="kindledDate" type="date" value="${esc(x.kindledDate||'')}"></label><label>Notes<textarea name="notes">${esc(x.notes||'')}</textarea></label><button class="primary" type="submit">${i<0?'Save breeding':'Save changes'}</button></form></div>`;let f=el('breedForm');f.elements.doeId.value=x.doeId||'';f.elements.buckId.value=x.buckId||'';f.elements.status.value=x.status||'Bred';let update=()=>{let d=parseDate(f.elements.date.value);el('duePreview').textContent=d?'Estimated kindling: '+dateISO(addDays(d,31))+' (typical range '+dateISO(addDays(d,28))+'–'+dateISO(addDays(d,33))+')':'Select a breeding date'};f.elements.date.addEventListener('input',update);update();f.onsubmit=e=>{e.preventDefault();let z=Object.fromEntries(new FormData(f));if(!db.rabbits.some(r=>r._id===z.doeId&&String(r.Sex).toLowerCase()==='doe')||!db.rabbits.some(r=>r._id===z.buckId&&String(r.Sex).toLowerCase()==='buck')){alert('Choose a valid doe and buck');return}if(z.doeId===z.buckId){alert('Choose two different rabbits');return}let previous=JSON.stringify(db.breedings);let rec={...x,...z,_id:x._id||'b-'+Date.now()};if(i<0)db.breedings.push(rec);else db.breedings[i]=rec;try{save();nav('Breeding')}catch(err){db.breedings=JSON.parse(previous);alert('Could not save. Check device storage and export a backup.')}}}

function createLitterFromBreeding(i) {
  const breeding = db.breedings[i];

  if (!breeding || breeding.status !== 'Kindled' || !breeding.kindledDate) {
    alert('Set the breeding to Kindled and enter the actual kindling date first.');
    return;
  }

  if (db.litters.some(l => l.breedingId === breeding._id)) {
    alert('A litter already exists for this breeding.');
    return;
  }

  const doe = db.rabbits.find((r, index) =>
  (r._id || 'r-import-' + index) === breeding.doeId
);

const buck = db.rabbits.find((r, index) =>
  (r._id || 'r-import-' + index) === breeding.buckId
);

  if (!doe || !buck) {
    alert('Could not find both parent records.');
    return;
  }

  const litter = {
    _id: 'l-' + Date.now(),
    breedingId: breeding._id,
    Name: (doe.Name || 'Rabbit') + ' litter ' + breeding.kindledDate,
    Prefix: '',
    Breed: doe.Breed || buck.Breed || '',
    Dam: doe.Name || '',
    Sire: buck.Name || '',
    DamID: doe._id,
    SireID: buck._id,
    Bred: breeding.date,
    Born: breeding.kindledDate,
    'Total Kits': '',
    'Sold Kits': '',
    'Died Kits': '',
    Notes: 'Created from breeding record.'
  };

  db.litters.push(litter);

  try {
    save();
    alert('Litter created successfully!');
    nav('Litters');
  } catch (err) {
    db.litters.pop();
    alert('Could not save litter: ' + err.message);
  }
}

function removeBreeding(i){if(!confirm('Delete this breeding record? This does not delete rabbits or litters.'))return;let old=db.breedings.slice();db.breedings.splice(i,1);try{save();nav('Breeding')}catch(e){db.breedings=old;alert('Could not delete: '+e.message)}}

/* Tangled Woods Rabbitry Manager v3.4 backup/restore enhancement.
   Load AFTER the existing inline application script. */
(() => {
  'use strict';
  const MAX_BYTES = 25 * 1024 * 1024;
  let candidate = null;
  const originalRender = render;
  function showBackup() {
    const view = document.getElementById('view');
    if (!view || page !== 'Backup') return;
    view.innerHTML = `<h2>Data & backups</h2>
      <div class="card"><h3>Download a backup</h3>
      <p>Save a complete JSON backup in Files or iCloud Drive. Keep a copy before importing or restoring.</p>
      <button class="primary" type="button" onclick="backup()">Download backup</button></div>
      <div class="card"><h3>Restore a backup</h3>
      <p>Choose a previously saved Tangled Woods JSON backup. You can review the record counts before replacing anything.</p>
      <button class="primary" id="twChooseBackup" type="button">Choose backup file</button>
      <label for="twBackupFile" class="tw-file-label">Or tap here to browse Files
        <input id="twBackupFile" type="file" accept=".json,application/json" style="display:block;width:100%;font-size:16px;margin-top:10px" aria-describedby="twRestoreStatus">
      </label>
      <p class="muted" id="twRestoreStatus" role="status" aria-live="polite">No file selected.</p>
      <div id="twRestorePreview"></div></div>
      <div class="card"><h3>Important</h3>
      <p>This app stores records in this browser, not in GitHub. Clearing Safari website data may erase records. Devices do not automatically sync.</p>
      <p class="muted">Restoring replaces the current rabbits, litters, breeding history, and manual pedigree links on this device.</p></div>`;
    const input = document.getElementById('twBackupFile');
    document.getElementById('twChooseBackup').addEventListener('click', () => {
      const status = document.getElementById('twRestoreStatus');
      status.textContent = 'Opening file picker… If nothing appears, tap “Or tap here to browse Files” below.';
      try { input.click(); } catch (err) { status.textContent = 'File picker could not open: ' + err.message; }
    });
    input.addEventListener('change', previewBackup);
  }
  render = function () { originalRender(); if (page === 'Backup') showBackup(); };
  function checkRecords(value, label) {
    if (!Array.isArray(value) || value.some(x => !x || typeof x !== 'object' || Array.isArray(x))) {
      throw new Error(label + ' must be an array of records.');
    }
  }
  async function previewBackup(event) {
    candidate = null;
    const status = document.getElementById('twRestoreStatus');
    const preview = document.getElementById('twRestorePreview');
    preview.replaceChildren();
    const file = event.target.files && event.target.files[0];
    if (!file) { status.textContent = 'No file selected. Tap the file field to try again.'; return; }
    status.textContent = 'Reading ' + file.name + '…';
    try {
      if (file.size > MAX_BYTES) throw new Error('Backup exceeds 25 MB.');
      const data = JSON.parse(await file.text());
      if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('Not a backup object.');
      checkRecords(data.rabbits, 'Rabbits');
      checkRecords(data.litters, 'Litters');
      if (data.breedings !== undefined) checkRecords(data.breedings, 'Breedings');
      if (data.parentLinks !== undefined && (!data.parentLinks || typeof data.parentLinks !== 'object' || Array.isArray(data.parentLinks))) {
        throw new Error('Parent links are invalid.');
      }
      const safe = {rabbits:data.rabbits, litters:data.litters,
        breedings:data.breedings || [], parentLinks:data.parentLinks || {}};
      candidate = safe;
      status.textContent = 'Backup selected: ' + file.name;
      const title = document.createElement('h3'); title.textContent = 'Backup preview';
      const counts = document.createElement('p');
      counts.textContent = `${safe.rabbits.length} rabbits · ${safe.litters.length} litters · ${safe.breedings.length} breedings · ${Object.keys(safe.parentLinks).length} manual pedigree links`;
      const note = document.createElement('p'); note.className = 'muted';
      note.textContent = 'These will replace the records currently stored in Safari. Download a backup of your current records first.';
      const button = document.createElement('button'); button.type = 'button'; button.className = 'primary';
      button.textContent = 'Restore this backup'; button.addEventListener('click', commitBackup);
      preview.append(title, counts, note, button);
    } catch (err) {
      status.textContent = 'Could not read backup: ' + err.message;
      event.target.value = '';
    }
  }
  function commitBackup() {
    if (!candidate) return;
    if (!confirm(`Replace the current ${db.rabbits.length} rabbits and ${db.litters.length} litters with ${candidate.rabbits.length} rabbits and ${candidate.litters.length} litters? This cannot be undone without another backup.`)) return;
    const previous = db;
    try {
      localStorage.setItem(KEY, JSON.stringify(candidate));
      db = candidate;
      candidate = null;
      nav('Home');
      alert('Backup restored successfully.');
    } catch (err) {
      db = previous;
      alert('Restore failed; existing records were kept. ' + err.message);
    }
  }
  // Replace the legacy restore handler too, so it cannot bypass preview/validation.
  restore = function () { nav('Backup'); };
  const footer = document.querySelector('footer');
  if (footer) footer.textContent = 'Version 3.4 · Local records · No automatic sync';
  render();
})();

<script id="tw-cloud-preview-script">
/* Read-only cloud preview: does not write to localStorage, IndexedDB, or Cloudflare. */
(function(){
  'use strict';
  options.push('Cloud Preview');
  const originalRenderCloud = render;
  let records = null, loading = false, error = '', category = 'rabbits', search = '', shown = 50;
  render = function(){
    originalRenderCloud();
    if(page === 'Cloud Preview') drawCloud();
  };
  function element(tag, text, cls){
    const e=document.createElement(tag);
    if(text!==undefined)e.textContent=String(text);
    if(cls)e.className=cls;
    return e;
  }
  async function loadCloud(){
    loading=true;error='';records=null;drawCloud();
    try{
      const [r,l]=await Promise.all(['rabbits','litters'].map(async type=>{
        const response=await fetch('/api/'+type,{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});
        if(!response.ok)throw Error(type+' request returned HTTP '+response.status);
        const data=await response.json();
        if(!data || !Array.isArray(data[type]))throw Error(type+' response was not a record list');
        return data[type];
      }));
      records={rabbits:r,litters:l};
    }catch(e){error=e.message||String(e)}
    finally{loading=false;if(page==='Cloud Preview')drawCloud()}
  }
  function drawCloud(){
    const view=document.getElementById('view');
    if(!view||page!=='Cloud Preview')return;
    view.replaceChildren();
    view.append(element('h2','Cloud records preview (read-only)'));
    view.append(element('p','This tab reads Cloudflare records only. It does not replace, import, edit, or save any records on this device. Your existing local data and pedigree layouts remain unchanged.','tw-cloud-note'));
    const btn=element('button',loading?'Loading cloud records…':records?'Reload cloud records':'Load cloud records','primary');
    btn.type='button';btn.disabled=loading;btn.addEventListener('click',loadCloud);view.append(btn);
    if(loading){view.append(element('p','Loading rabbits and litters…'));return}
    if(error){view.append(element('p','Unable to load cloud records: '+error+' — check your Cloudflare login and try again.'));return}
    if(!records){view.append(element('p','Click Load cloud records to begin.','muted'));return}
    view.append(element('p',records.rabbits.length+' rabbits · '+records.litters.length+' litters retrieved from Cloudflare.'));
    const choices=document.createElement('div');choices.className='row';
    for(const type of ['rabbits','litters']){
      const b=element('button',type==='rabbits'?'Rabbits':'Litters',category===type?'primary':'');
      b.type='button';b.addEventListener('click',()=>{category=type;search='';shown=50;drawCloud()});choices.append(b)
    }
    view.append(choices);
    const field=element('input');field.type='search';field.placeholder='Search '+category+' by name, tattoo, parent, or other field';field.value=search;
    view.append(field);
    const count=element('p','','muted');view.append(count);
    const list=document.createElement('div');view.append(list);
    const more=element('button','Show 50 more');more.type='button';view.append(more);
    function updateList(){
      const term=search.trim().toLowerCase();
      const matches=records[category].filter(x=>x&&typeof x==='object'&&(!term||Object.values(x).some(v=>String(v??'').toLowerCase().includes(term))));
      count.textContent=matches.length+' matching '+category+' · showing '+Math.min(shown,matches.length);
      list.replaceChildren();
      for(const x of matches.slice(0,shown)){
        const title=[x.Prefix,x.Name].filter(Boolean).join(' ')||x.Name||x._id||'Unnamed record';
        const summary=category==='rabbits'?[x.Breed,x.Sex,x.Tattoo]:[x.Born,x.Mother,x.Father];
        const button=element('button',undefined,'tw-cloud-item');button.type='button';
        button.append(element('strong',title),element('span',summary.filter(Boolean).join(' · '),'muted'));
        button.addEventListener('click',()=>{
          const existing=button.querySelector('.tw-cloud-fields');
          if(existing){existing.remove();return}
          const details=element('div',undefined,'tw-cloud-fields');
          for(const [key,val] of Object.entries(x)){
            if(key.startsWith('_')||val==null||val==='')continue;
            details.append(element('p',key+': '+(typeof val==='object'?JSON.stringify(val):String(val))));
          }
          button.append(details);
        });list.append(button);
      }
      more.hidden=shown>=matches.length;
    }
    field.addEventListener('input',()=>{search=field.value;shown=50;updateList()});
    more.addEventListener('click',()=>{shown+=50;updateList()});
    updateList();
  }
  render();
})();
</script>

(function(){

 let cloudMode=false, cloudRecords=null, localDb=null, loading=false;
 // Read-only indicator of isolated cloud mode for the editor.

 options.push('Cloud App');

 function hideCloudEditing(){

             const body=await response.json();
             if(!response.ok || body.saved!==true || body.rabbit?._id!=='TEST-001')throw Error(body.error||'Save not confirmed (HTTP '+response.status+')');
             const check=await fetch('/api/rabbits',{credentials:'same-origin',cache:'no-store',headers:{Accept:'application/json'}});
             if(!check.ok)throw Error('Saved, but verification request failed (HTTP '+check.status+')');
             const verified=await check.json();
             const found=verified.rabbits?.find(x=>x._id==='TEST-001');
             if(!found || found.Name!==newName)throw Error('Saved, but the retrieved name did not match');
             db.rabbits[args[1]]=found;
             status.textContent='Saved and independently verified in test database: '+found.Name;
             // Keep the verified message visible; the full detail refreshes on next navigation.
           }catch(e){status.textContent='Save/verification issue: '+e.message}
           finally{btn.disabled=false}

       }
     }
   }
   return result;
 };
 pedigree=function(...args){const result=originalPedigree(...args);hideCloudEditing();return result};
 backup=function(...args){if(cloudMode)return blocked();return originalBackup(...args)};
 previewCSV=function(...args){if(cloudMode)return blocked();return originalPreviewCSV(...args)};
 function blocked(){alert('Other editing features are disabled in this isolated cloud test workspace.');}
 edit=function(...args){if(cloudMode)return blocked();return originalEdit(...args)};
 parentEditor=function(...args){if(cloudMode)return blocked();return originalParentEditor(...args)};
 function cloudBreedingEditor(i=-1){
  const isNew = i < 0;

  if (!isNew && !breeding) {

  const cancelButton = document.createElement('button');
cancelButton.type = 'button';
cancelButton.textContent = '← Cancel';
cancelButton.onclick = () => nav('Breeding');
view.prepend(cancelButton);
const form = document.createElement('form');
form.id = 'cloudBreedingForm';

const doeLabel = document.createElement('label');
doeLabel.textContent = 'Doe';

const doeSelect = document.createElement('select');
doeSelect.name = 'doeId';

const doePlaceholder = document.createElement('option');

for (const rabbit of db.rabbits) {

const buckSelect = document.createElement('select');

const buckPlaceholder = document.createElement('option');
buckPlaceholder.value = '';
buckPlaceholder.textContent = 'Choose buck…';
buckSelect.append(buckPlaceholder);
for (const rabbit of db.rabbits) {
  if (
    String(rabbit.Sex).toLowerCase() !== 'buck' ||
    (rabbit.Archived === true && rabbit._id !== breeding.buckId)
  ) continue;

  const option = document.createElement('option');
  option.value = rabbit._id;
  option.textContent = rabbitLabel(rabbit._id);
  buckSelect.append(option);

function updateDuePreview() {

for (const status of statuses) {

kindledLabel.append(kindledInput);

notesLabel.append(notesInput);

    const [year, month, day] = value.split('-').map(Number);

  };

  };
      if (!isNew) {

        };
      }

    }

<script id="tw-cloud-edit-any-test-rabbit">
/* Four-field editor for test rabbits. Attach after synchronous detail rendering. */
(function () {
  'use strict';
  const fields = ['Prefix', 'Name', 'Sex', 'Tattoo', 'Breed', 'Color', 'DOB', 'Father', 'Mother', 'Weight', 'Status', 'Notes'];
  const previousDetail = detail;

  detail = function (type, index) {
    const result = previousDetail(type, index);
    if (type !== 'rabbits') return result;
    queueMicrotask(() => {
    const rabbit = db.rabbits[index];
    const isCloudDetail = window.twIsCloudTestMode?.() === true;
    if (!isCloudDetail ||
        !rabbit || !/^TEST-(?:001|[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})$/i.test(rabbit._id || '')) return result;

    const card = document.querySelector('#view > .card');
    if (!card) return result;
    // Remove the legacy TEST-001 name-only editor, including its save handler.
    for (const old of card.querySelectorAll('section.tw-cloud-app-banner')) old.remove();

    const panel = document.createElement('section');
    panel.className = 'tw-cloud-app-banner no-print';

    heading.textContent = 'Edit rabbit — TEST DATABASE ONLY';
    panel.append(heading);
    const form = document.createElement('form');

    const expected = {};
    for (const key of fields) {
      expected[key] = String(rabbit[key] ?? '');
      const label = document.createElement('label');
      label.textContent = key;
      const input = key === 'Sex' ? document.createElement('select') : document.createElement('input');
      if (key === 'Sex') {

          option.textContent = value;
          input.append(option);
        }
      } else {
        input.type = 'text';
        input.maxLength = 100;
      }
      input.name = key;
      input.value = expected[key];
      input.required = key === 'Name' || key === 'Sex';
      label.append(input);
      form.append(label);
      inputs[key] = input;
    }
    const saveButton = document.createElement('button');
    saveButton.type = 'submit';
    saveButton.className = 'primary';
    saveButton.textContent = 'Save test rabbit';
       var archiveButton = document.createElement('button');
archiveButton.type = 'button';
archiveButton.textContent = rabbit.Archived === true
  ? 'Restore Rabbit'
  : 'Archive Rabbit';
    const status = document.createElement('p');
    status.setAttribute('role', 'status');
    form.append(saveButton, archiveButton, status);
    panel.append(form);
    card.append(panel);

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const changes = Object.fromEntries(fields.map(key => [key, inputs[key].value.trim()]));
      if (!changes.Name || !['Buck', 'Doe'].includes(changes.Sex)) {
        status.textContent = 'Enter a name and select Buck or Doe.';
        return;
      }
      if (!confirm('Save changes to ' + rabbit._id + ' in the TEST database?')) return;
      saveButton.disabled = true;
      status.textContent = 'Saving to test database…';
      let saved = false;
      try {
        const response = await fetch('/api/test-save-rabbit', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify({ _id: rabbit._id, ...changes, expected })
        });
        const body = await response.json();
        if (!response.ok || body.saved !== true || body.rabbit?._id !== rabbit._id)
          throw Error(body.error || 'Save not confirmed (HTTP ' + response.status + ').');
        saved = true;
        const check = await fetch('/api/rabbits', {
          credentials: 'same-origin', cache: 'no-store',
          headers: { Accept: 'application/json' }
        });
        if (!check.ok) throw Error('Verification request failed (HTTP ' + check.status + ').');
        const data = await check.json();
        const verified = data.rabbits?.find(r => r._id === rabbit._id);
        if (!verified || fields.some(key => String(verified[key] ?? '') !== changes[key]))
          throw Error('Saved values did not match the database verification.');
        db.rabbits[index] = verified;
        for (const key of fields) expected[key] = String(verified[key] ?? '');
        status.textContent = 'Saved and verified: ' + verified.Name + '. Return to the rabbit list to see updated details.';
      } catch (error) {
        status.textContent = (saved ? 'Save may have succeeded; reload cloud records before retrying. ' : 'Save issue: ') + error.message;
      } finally {
        saveButton.disabled = false;
      }
    });
    archiveButton.addEventListener('click', async () => {
  const restoring = rabbit.Archived === true;
  const action = restoring ? 'restore' : 'archive';

  if (!confirm(
    'Are you sure you want to ' + action + ' ' + rabbit.Name + '?'
  )) return;

  status.textContent = 'Preparing to ' + action + ' rabbit...';
       archiveButton.disabled = true;
saveButton.disabled = true;

try {
  const changes = Object.fromEntries(
    fields.map(key => [key, inputs[key].value.trim()])
  );

  const response = await fetch('/api/test-save-rabbit', {
    method: 'POST',
    credentials: 'same-origin',
    headers: {
      'Content-Type': 'application/json',
      Accept: 'application/json'
    },
    body: JSON.stringify({
      _id: rabbit._id,
      ...changes,
      Archived: !restoring,
      expected
    })
  });

  const body = await response.json();

  if (!response.ok || body.saved !== true) {
    throw new Error(body.error || 'Archive save failed');
  }

  const check = await fetch('/api/rabbits', {
  credentials: 'same-origin',
  cache: 'no-store',
  headers: { Accept: 'application/json' }
});

if (!check.ok) {
  throw new Error('Could not verify archive status');
}

const data = await check.json();
const verified = data.rabbits?.find(r => r._id === rabbit._id);

if (!verified || verified.Archived !== !restoring) {
  throw new Error('Archive status did not match the database');
}

db.rabbits[index] = verified;
rabbit.Archived = verified.Archived;
   
   archiveButton.textContent = verified.Archived
  ? 'Restore Rabbit'
  : 'Archive Rabbit';

status.textContent = verified.Archived
  ? 'Rabbit archived and verified.'
  : 'Rabbit restored and verified.';
archiveButton.disabled = false;
} catch (error) {
  status.textContent = 'Archive/restore issue: ' + error.message;
   archiveButton.disabled = true;
status.textContent += ' Reload cloud records before trying again.';
} finally {
 
  saveButton.disabled = false;
}
    });
    });
    return result;
  };
})();

<script id="tw-test-create-rabbit-ui">
/* Add new rabbits only inside the isolated Cloud App test workspace. */
(function () {
  'use strict';
  const priorRender = render;
  const fields = ['Prefix', 'Name', 'Sex', 'Tattoo', 'Breed', 'Color', 'DOB', 'Father', 'Mother', 'Weight', 'Status', 'Notes'];;

  function isCloudTestView() {
    const banner = document.querySelector('#view > .tw-cloud-app-banner');
    return page === 'Rabbits' && !!banner &&
      banner.textContent.includes('CLOUD TEST') &&
      db && Array.isArray(db.rabbits);
  }

  function showCreateForm() {
    if (!isCloudTestView()) return;
    const view = el('view');
    view.replaceChildren();
    const back = document.createElement('button');
    back.type = 'button';
    back.textContent = '← Back to cloud rabbits';
    back.onclick = () => nav('Rabbits');
    view.append(back);

    const title = document.createElement('h2');
    title.textContent = 'Add rabbit — TEST DATABASE ONLY';
    view.append(title);
    const note = document.createElement('p');
    note.className = 'tw-cloud-app-banner';
    note.textContent = 'Creates one new rabbit in the isolated test database. No local records or production records will be changed.';
    view.append(note);

    const form = document.createElement('form');
    const controls = {};
    for (const field of fields) {
      const label = document.createElement('label');
      label.textContent = field;
      let input;
      if (field === 'Sex') {
        input = document.createElement('select');
        for (const [value, text] of [['', 'Choose Buck or Doe'], ['Buck', 'Buck'], ['Doe', 'Doe']]) {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = text;
          input.append(option);
        }
      } else {
        input = document.createElement('input');
        input.type = 'text';
        input.maxLength = 100;
      }
      input.name = field;
      input.required = field === 'Name' || field === 'Sex';
      label.append(input);
      form.append(label);
      controls[field] = input;
    }
    const submit = document.createElement('button');
    submit.type = 'submit';
    submit.className = 'primary';
    submit.textContent = 'Create test rabbit';
    form.append(submit);
    const status = document.createElement('p');
    status.setAttribute('role', 'status');
    form.append(status);
    view.append(form);

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const values = Object.fromEntries(fields.map(field => [field, controls[field].value.trim()]));
      if (!values.Name || !['Buck', 'Doe'].includes(values.Sex)) {
        status.textContent = 'Enter a name and choose Buck or Doe.';
        return;
      }
      if (!confirm('Create ' + values.Name + ' in the TEST database?')) return;
      submit.disabled = true;
      status.textContent = 'Creating rabbit in test database…';
      let createdId = null;
      try {
        const response = await fetch('/api/test-create-rabbit', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
          body: JSON.stringify(values)
        });
        const result = await response.json();
        if (!response.ok || result.created !== true ||
            typeof result.rabbit?._id !== 'string' ||
            !result.rabbit._id.startsWith('TEST-')) {
          throw new Error(result.error || 'Creation was not confirmed.');
        }
        createdId = result.rabbit._id;
        status.textContent = 'Created. Checking the saved record…';
        const check = await fetch('/api/rabbits', {
          credentials: 'same-origin', cache: 'no-store',
          headers: { Accept: 'application/json' }
        });
        if (!check.ok) throw new Error('Verification request failed.');
        const data = await check.json();
        if (!Array.isArray(data.rabbits)) throw new Error('Invalid verification response.');
        const verified = data.rabbits.find(r => r._id === createdId);
        if (!verified || fields.some(field => String(verified[field] ?? '') !== values[field])) {
          throw new Error('Saved rabbit did not match the submitted fields.');
        }

        status.textContent = 'Created and verified: ' + verified.Name + ' (' + createdId + ').';
        form.querySelectorAll('input, select').forEach(control => control.disabled = true);
        submit.textContent = 'Rabbit created';
      } catch (error) {
        status.textContent = (createdId ? 'Rabbit may have been created. Do not retry yet; reload cloud records first. ' : 'Creation failed: ') + error.message;
        submit.disabled = !!createdId;
      }
    });
  }

  render = function (...args) {
    const result = priorRender(...args);
    if (isCloudTestView()) {
      const banner = document.querySelector('#view > .tw-cloud-app-banner');
      if (banner && !document.getElementById('twCreateTestRabbit')) {
        const button = document.createElement('button');
        button.id = 'twCreateTestRabbit';
        button.type = 'button';
        button.className = 'primary';
        button.textContent = '+ Add test rabbit';
        button.onclick = showCreateForm;
        banner.append(button);
      }
    }
    return result;
  };
})();
</script>

/* Step 198: restore the last open tab or record after a browser refresh.
   Navigation state is kept separately from rabbitry data and backups. */
(function(){
  const STATE_KEY='tangledwoods-last-view-v1';
  function remember(state){try{sessionStorage.setItem(STATE_KEY,JSON.stringify(state))}catch(e){}}
  const previousNav=window.nav;
  window.nav=function(p){const result=previousNav(p);remember({page:p});return result};
  const previousRender=window.render;
  window.render=function(){const result=previousRender();remember({page:page});return result};
  const previousDetail=window.detail;
  window.detail=function(type,index){
    const result=previousDetail(type,index);
    if((type==='rabbits'||type==='litters')&&db[type]&&db[type][index]){
      remember({page:type==='rabbits'?'Rabbits':'Litters',type:type,index:index,id:db[type][index]._id||null});
    }
    return result;
  };
  // Restore after all feature scripts have installed their detail wrappers.
  // Restoring immediately here skipped later kit reservation/payment cards.
  setTimeout(function(){
    try{
      const last=JSON.parse(sessionStorage.getItem(STATE_KEY)||'null');
      if(!last||!['Home','Rabbits','Litters','Breeding','Pedigrees','Import','Backup'].includes(last.page))return;
      if(last.page==='Home')return;
      previousNav(last.page);
      if((last.type==='rabbits'||last.type==='litters')&&Number.isInteger(last.index)){
        let index=last.index;
        if(last.id&&db[last.type][index]?._id!==last.id)index=db[last.type].findIndex(r=>r._id===last.id);
        if(index>=0&&index<db[last.type].length)window.detail(last.type,index);
      }
    }catch(e){/* Invalid navigation state should never block opening the app. */}
  },0);
})();
</script>

<script id="tw-step209-payment-history">
/* Step 209: a single kit payment ledger. Legacy deposits are included once,
   and the ledger is preserved on the rabbit even if a reservation is canceled. */
(function(){
 const oldDetail=window.detail;
 const money=c=> (c/100).toLocaleString('en-US',{style:'currency',currency:'USD'});
 function cents(raw){
  if(!/^\d+(?:\.\d{1,2})?$/.test(raw))return null;
  const [whole,fraction='']=raw.split('.');
  const value=Number(whole)*100+Number(fraction.padEnd(2,'0'));
  return Number.isSafeInteger(value)?value:null;
 }
 window.detail=function(type,index){
  const result=oldDetail(type,index);
  if(type!=='rabbits'||window.twIsCloudTestMode?.()===true)return result;
  const rabbit=db.rabbits[index],view=document.getElementById('view');
  if(!rabbit||!rabbit.litterId||!view)return result;
  const reservation=rabbit.kitReservation||{};
  const ledger=Array.isArray(rabbit.kitPayments)?rabbit.kitPayments:[];
  const legacy=ledger.length===0&&Number.isSafeInteger(reservation.depositCents)&&reservation.depositCents>0;
  const entries=ledger.length?ledger:(legacy?[{date:reservation.date||'',amountCents:reservation.depositCents,note:'Original deposit (from reservation)'}]:[]);
  const paid=entries.reduce((sum,p)=>sum+(Number.isSafeInteger(p.amountCents)?p.amountCents:0),0);
  const price=Number.isSafeInteger(reservation.salePriceCents)?reservation.salePriceCents:null;
  const card=document.createElement('section');card.className='card';
  const h=document.createElement('h3');h.textContent='Payment History';card.append(h);
  if(price!==null){
   const opening=document.createElement('p');
   opening.textContent='Beginning balance: '+money(price);
   opening.style.marginBottom='12px';card.append(opening);
  }
  if(entries.length){
   const list=document.createElement('div');
   let running=price;
   entries.forEach((entry,i)=>{
    const line=document.createElement('p');
    running=running===null?null:running-entry.amountCents;
    line.textContent=(i+1)+'. '+(entry.date||'Date not recorded')+' — Payment '+money(entry.amountCents)+(entry.note?' ('+entry.note+')':'')+(running===null?'':' — Balance '+money(running));
    list.append(line);
   });
   card.append(list);
  }else{const p=document.createElement('p');p.textContent='No payments recorded.';card.append(p)}
  const total=document.createElement('p');total.textContent='Total paid: '+money(paid);card.append(total);
  const remaining=document.createElement('p');
  remaining.textContent='Remaining balance: '+(price===null?'Sale price not set':money(price-paid));
  remaining.style.fontWeight='700';remaining.style.fontSize='1.2rem';remaining.style.marginTop='10px';
  card.append(remaining);
  const add=document.createElement('button');add.type='button';add.textContent='Add Payment';card.append(add);
  const form=document.createElement('form');form.hidden=true;
  function field(label,type){const wrap=document.createElement('label');wrap.textContent=label;const input=document.createElement('input');input.type=type;wrap.append(input);form.append(wrap);return input}
  const date=field('Payment date','date');date.required=true;date.value=new Date().toLocaleDateString('en-CA');
  const amount=field('Payment amount ($)','number');amount.required=true;amount.min='0.01';amount.step='0.01';
  const note=field('Payment note (optional)','text');
  const saveButton=document.createElement('button');saveButton.type='submit';saveButton.className='primary';saveButton.textContent='Save Payment';
  const cancel=document.createElement('button');cancel.type='button';cancel.textContent='Cancel';cancel.onclick=()=>{form.hidden=true;add.hidden=false};
  form.append(saveButton,cancel);card.append(form);
  add.onclick=()=>{add.hidden=true;form.hidden=false;amount.focus()};
  form.onsubmit=e=>{
   e.preventDefault();
   const value=cents(amount.value.trim());
   if(!date.value||value===null||value<=0){alert('Enter a payment date and a valid amount greater than zero.');return}
   if(price!==null&&paid+value>price){alert('Payment exceeds the remaining sale balance.');return}
   const oldPayments=rabbit.kitPayments,oldReservation=rabbit.kitReservation;
   const next=[...entries.map(p=>({...p})),{date:date.value,amountCents:value,note:note.value.trim()}];
   rabbit.kitPayments=next;
   if(rabbit.kitReservation){
    rabbit.kitReservation={...rabbit.kitReservation,depositCents:next.reduce((sum,p)=>sum+p.amountCents,0)};
   }
   try{save();window.detail('rabbits',index)}
   catch(err){if(oldPayments===undefined)delete rabbit.kitPayments;else rabbit.kitPayments=oldPayments;rabbit.kitReservation=oldReservation;alert('Payment could not be saved. Existing records were kept.')}
  };
  const reservationCard=[...view.querySelectorAll('section.card')].find(c=>c.querySelector('h3')?.textContent==='Kit Reservation');
  if(reservationCard){
   // Replace Step 203's static amounts with the shared ledger totals.
   for(const div of [...reservationCard.querySelectorAll('div')]){

<script id="tw-step221-sales-pickup-cleanup">
(function(){
  const previousDetail=window.detail;
  const readableDate=value=>{
    if(!/^\d{4}-\d{2}-\d{2}$/.test(value||''))return value;
    const [year,month,day]=value.split('-').map(Number);
    const date=new Date(year,month-1,day);
    return date.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  };
  window.detail=function(type,index){
    const result=previousDetail.apply(this,arguments);
    if(type!=='rabbits')return result;
    const rabbit=typeof db!=='undefined'&&db.rabbits?.[index];
    if(!rabbit?.litterId)return result;
    const view=document.getElementById('view');
    const card=[...(view?.querySelectorAll('section.card')||[])].find(c=>c.querySelector('h3')?.textContent==='Buyer & sale details');
    if(!card)return result;
    const statusTitle=[...card.querySelectorAll('h4')].find(h=>h.textContent==='Sale status');
    if(statusTitle){
      const status=statusTitle.nextElementSibling;
      if(status?.tagName==='P'){
        status.textContent=rabbit.sale?.pickupActualDate?'Picked Up':rabbit.sale?.completedAt?'Sold — Awaiting Pickup':'Not Sold';
        status.style.fontWeight='700';
      }
      let item=status?.nextElementSibling;
      while(item && item.tagName==='P'){
        const next=item.nextElementSibling;
        if(item.textContent.includes('Pickup tracking will be added next.'))item.remove();
        else if(item.textContent.startsWith('Sale completed: '))item.textContent='Sold on '+readableDate(rabbit.sale?.completedAt);
        item=next;
      }
    }
    const pickup=card.querySelector('#tw-step219-pickup');
    if(pickup){
      const summary=pickup.querySelector('h4 + p');
      if(summary)summary.textContent=rabbit.sale?.pickupScheduledDate?'Scheduled pickup: '+readableDate(rabbit.sale.pickupScheduledDate):'Pickup not scheduled';
      const actual=[...pickup.querySelectorAll('p')].find(p=>p.textContent.startsWith('Actual pickup: '));
      if(actual&&rabbit.sale?.pickupActualDate)actual.textContent='Picked up: '+readableDate(rabbit.sale.pickupActualDate);
    }
    return result;
  };
})();
</script>

<script id="tw-step226-filtered-sales-dashboard">
(function(){
 const oldRender=window.render;
 const money=c=>(c/100).toLocaleString('en-US',{style:'currency',currency:'USD'});
 const cents=n=>Number.isSafeInteger(n)?n:0;
 const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
 let mode='all',customStart='',customEnd='';
 function dashboard(){
  if(page!=='Home')return;
  const root=document.getElementById('view');if(!root)return;
  root.querySelector('#tw-step226-dashboard')?.remove();
  const now=today(),year=now.slice(0,4),month=now.slice(0,7);
  const valid=d=>typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!Number.isNaN(new Date(d+'T12:00:00').getTime());
  const included=d=>mode==='all'||(valid(d)&&(mode==='month'?d.slice(0,7)===month:mode==='year'?d.slice(0,4)===year:(!customStart||d>=customStart)&&(!customEnd||d<=customEnd)));
  let sales=0,received=0,due=0,awaiting=0,picked=0,undated=0,unsold=0;
  const rows=[];
  for(const rabbit of db.rabbits||[]){
   if(!rabbit?.litterId)continue;
   const r=rabbit.kitReservation||{},sale=rabbit.sale||{};
   const ledger=Array.isArray(rabbit.kitPayments)&&rabbit.kitPayments.length?rabbit.kitPayments:[...(cents(r.depositCents)>0?[{amountCents:r.depositCents,date:r.date||''}]:[])];
   const allPaid=ledger.reduce((a,p)=>a+cents(p?.amountCents),0);
   for(const payment of ledger){if(included(payment.date))received+=cents(payment.amountCents);else if(mode!=='all'&&!valid(payment.date))undated++;}
   const sold=!!sale.completedAt,price=Number.isSafeInteger(r.salePriceCents)?r.salePriceCents:null;
   if(sold&&included(sale.saleDate||sale.completedAt)){
    sales+=price||0;
    const pickup=!!(sale.pickupActualDate||sale.actualPickupDate||sale.pickedUpAt);
    if(pickup)picked++;else awaiting++;
    if(price!==null)due+=Math.max(0,price-allPaid);
    rows.push({rabbit:typeof name==='function'?name(rabbit):rabbit.Name||'Unnamed kit',buyer:sale.buyerSource==='different'?sale.buyerName:r.customerName,status:pickup?'Picked Up':'Awaiting Pickup',price,paid:allPaid,due:price===null?null:Math.max(0,price-allPaid)});
   }else if(!sold&&r.customerName&&included(r.date))unsold++;
  }
  const section=document.createElement('section');section.id='tw-step226-dashboard';section.className='card';
  const title=document.createElement('h3');title.textContent='Sales overview';section.append(title);
  const controls=document.createElement('div');controls.style.cssText='display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0';
  const label=document.createElement('label');label.textContent='Show: ';
  const select=document.createElement('select');
  for(const [value,text] of [['all','All time'],['month','This month'],['year','This year'],['custom','Custom dates']]){const opt=document.createElement('option');opt.value=value;opt.textContent=text;select.append(opt);}
  select.value=mode;select.onchange=()=>{mode=select.value;dashboard()};label.append(select);controls.append(label);
  if(mode==='custom'){
   const dates=document.createElement('div');
   dates.style.cssText='display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;width:100%;align-items:end';
   for(const [text,value,update] of [['From',customStart,v=>customStart=v],['To',customEnd,v=>customEnd=v]]){
    const l=document.createElement('label');l.textContent=text;
    l.style.cssText='display:flex;flex-direction:column;gap:5px;min-width:0';
    const input=document.createElement('input');input.type='date';input.value=value;
    input.style.cssText='box-sizing:border-box;width:100%;min-width:0';
    input.onchange=()=>{update(input.value);dashboard()};l.append(input);dates.append(l);
   }
   controls.append(dates);
  }
  section.append(controls);
  const stats=document.createElement('div');stats.className='stats';
  for(const [label,value] of [['Recorded sales',money(sales)],['Payments collected',money(received)],['Sold balances due',money(due)],['Sold — awaiting pickup',String(awaiting)],['Picked up',String(picked)],['Reservations not sold',String(unsold)]]){
   const tile=document.createElement('div');tile.className='card stat';const strong=document.createElement('strong');strong.textContent=value;tile.append(strong,document.createTextNode(label));stats.append(tile);
  }
  section.append(stats);
  const note=document.createElement('p');note.textContent='Sales use sale dates; payments use payment dates. Balances show current amounts owed on sales in this period.';section.append(note);
  if(mode!=='all'&&undated){const warn=document.createElement('p');warn.textContent=undated+' payment record(s) have no valid date and are excluded from this date range. They remain in All time.';section.append(warn);}
  if(rows.length){const h=document.createElement('h4');h.textContent='Sold kits';section.append(h);const wrap=document.createElement('div');wrap.style.overflowX='auto';const table=document.createElement('table');table.style.width='100%';const tr=document.createElement('tr');for(const x of ['Rabbit','Buyer','Status','Price','Paid (all time)','Due']){const th=document.createElement('th');th.textContent=x;tr.append(th)}const head=document.createElement('thead');head.append(tr);table.append(head);const body=document.createElement('tbody');for(const r of rows){const tr=document.createElement('tr');for(const value of [r.rabbit,r.buyer||'Not recorded',r.status,r.price===null?'Not set':money(r.price),money(r.paid),r.due===null?'Not set':money(r.due)]){const td=document.createElement('td');td.textContent=value;td.style.padding='8px';tr.append(td)}body.append(tr)}table.append(body);wrap.append(table);section.append(wrap)}
  root.append(section);
 }
 window.render=function(){const result=oldRender.apply(this,arguments);try{dashboard()}catch(e){console.error('Sales dashboard error',e)}return result};
 try{dashboard()}catch(e){console.error('Sales dashboard error',e)}
})();
</script>

<script id="tw-step230-monthly-csv-export">
(function(){
 const previousRender=window.render;
 let selectedYear=String(new Date().getFullYear());
 const money=c=>(c/100).toLocaleString('en-US',{style:'currency',currency:'USD'});
 const cents=v=>Number.isSafeInteger(v)?v:0;
 const valid=d=>{
  if(typeof d!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(d))return false;
  const [y,m,day]=d.split('-').map(Number),dt=new Date(y,m-1,day);
  return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===day;
 };
 function renderMonthly(){
  if(typeof page==='undefined'||page!=='Home')return;
  const root=document.getElementById('view');
  if(!root)return;
  root.querySelector('#tw-step229-monthly')?.remove();
  const dashboard=root.querySelector('#tw-step226-dashboard');
  if(!dashboard)return;
  const rabbits=(typeof db!=='undefined'&&Array.isArray(db.rabbits))?db.rabbits:[];
  const years=new Set([String(new Date().getFullYear())]);
  for(const rabbit of rabbits){
   if(!rabbit?.litterId)continue;
   const sale=rabbit.sale||{},res=rabbit.kitReservation||{};
   for(const d of [sale.saleDate||sale.completedAt,sale.pickupActualDate]){
    if(valid(d))years.add(d.slice(0,4));
   }
   const payments=Array.isArray(rabbit.kitPayments)&&rabbit.kitPayments.length?rabbit.kitPayments:
    (cents(res.depositCents)>0?[{amountCents:res.depositCents,date:res.date||''}]:[]);
   for(const p of payments)if(valid(p.date))years.add(p.date.slice(0,4));
  }
  const options=[...years].sort((a,b)=>b.localeCompare(a));
  if(!options.includes(selectedYear))selectedYear=options[0];
  const months=Array.from({length:12},(_,i)=>({month:i+1,sales:0,received:0,due:0,sold:0,picked:0}));
  let undatedPayments=0;
  for(const rabbit of rabbits){
   if(!rabbit?.litterId)continue;
   const sale=rabbit.sale||{},res=rabbit.kitReservation||{};
   const payments=Array.isArray(rabbit.kitPayments)&&rabbit.kitPayments.length?rabbit.kitPayments:
    (cents(res.depositCents)>0?[{amountCents:res.depositCents,date:res.date||''}]:[]);
   const paidAll=payments.reduce((a,p)=>a+cents(p?.amountCents),0);
   for(const p of payments){
    if(valid(p?.date)){
     if(p.date.slice(0,4)===selectedYear)months[Number(p.date.slice(5,7))-1].received+=cents(p.amountCents);
    }else if(cents(p?.amountCents)!==0)undatedPayments++;
   }
   const soldDate=sale.saleDate||sale.completedAt;
   if(sale.completedAt&&valid(soldDate)&&soldDate.slice(0,4)===selectedYear){
    const m=months[Number(soldDate.slice(5,7))-1];
    m.sold++;
    if(Number.isSafeInteger(res.salePriceCents)){
     m.sales+=res.salePriceCents;
     m.due+=Math.max(0,res.salePriceCents-paidAll);
    }
   }
   if(valid(sale.pickupActualDate)&&sale.pickupActualDate.slice(0,4)===selectedYear){
    months[Number(sale.pickupActualDate.slice(5,7))-1].picked++;
   }
  }
  const section=document.createElement('section');section.id='tw-step229-monthly';section.className='card';
  const h=document.createElement('h3');h.textContent='Monthly sales report';section.append(h);
  const controls=document.createElement('label');controls.textContent='Year: ';
  const select=document.createElement('select');
  for(const y of options){const option=document.createElement('option');option.value=y;option.textContent=y;select.append(option)}
  select.value=selectedYear;select.onchange=()=>{selectedYear=select.value;renderMonthly()};
  controls.append(select);section.append(controls);
  const wrap=document.createElement('div');wrap.style.cssText='overflow-x:auto;margin-top:12px';
  const table=document.createElement('table');table.style.width='100%';
  const thead=document.createElement('thead'),hr=document.createElement('tr');
  for(const label of ['Month','Sales','Payments received','Current balance due','Sold','Picked up']){
   const th=document.createElement('th');th.textContent=label;th.style.padding='8px';hr.append(th);
  }
  thead.append(hr);table.append(thead);
  const tbody=document.createElement('tbody');
  const totals={sales:0,received:0,due:0,sold:0,picked:0};
  function row(label,m,bold){
   const tr=document.createElement('tr');
   const values=[label,money(m.sales),money(m.received),money(m.due),String(m.sold),String(m.picked)];
   for(const v of values){const td=document.createElement('td');td.textContent=v;td.style.padding='8px';if(bold)td.style.fontWeight='bold';tr.append(td)}
   return tr;
  }
  for(const m of months){
   const label=new Date(Number(selectedYear),m.month-1,1).toLocaleString('en-US',{month:'long'});
   tbody.append(row(label,m,false));
   for(const key of Object.keys(totals))totals[key]+=m[key];
  }
  tbody.append(row('Year total',totals,true));table.append(tbody);wrap.append(table);section.append(wrap);
  const exportButton=document.createElement('button');
  exportButton.type='button';
  exportButton.textContent='Download CSV';
  exportButton.style.marginTop='12px';
  exportButton.addEventListener('click',()=>{
   const quote=v=>'"'+String(v).replace(/"/g,'""')+'"';
   const dollar=c=>(c/100).toFixed(2);
   const lines=[['Month','Sales (USD)','Payments received (USD)','Current balance due (USD)','Rabbits sold','Rabbits picked up']];
   for(const m of months){
    const label=new Date(Number(selectedYear),m.month-1,1).toLocaleString('en-US',{month:'long'});
    lines.push([label,dollar(m.sales),dollar(m.received),dollar(m.due),m.sold,m.picked]);
   }
   lines.push(['Year total',dollar(totals.sales),dollar(totals.received),dollar(totals.due),totals.sold,totals.picked]);
   const csv='\uFEFF'+lines.map(r=>r.map(quote).join(',')).join('\r\n')+'\r\n';
   const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
   const url=URL.createObjectURL(blob);
   const a=document.createElement('a');
   a.href=url;a.download='tangled-woods-monthly-sales-'+selectedYear+'.csv';
   document.body.append(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
  section.append(exportButton);

  const note=document.createElement('p');
  note.textContent='Sales are grouped by sale date, payments by date received, and pickups by actual pickup date. Balance due is the current unpaid amount on sales from each month, not the balance at that month’s end.';
  section.append(note);
  if(undatedPayments){
   const warn=document.createElement('p');
   warn.textContent=undatedPayments+' payment record(s) lack a valid date and are excluded from monthly payment totals.';
   section.append(warn);
  }
  dashboard.insertAdjacentElement('afterend',section);
 }
 window.render=function(){const result=previousRender.apply(this,arguments);try{renderMonthly()}catch(e){console.error('Monthly report error',e)}return result};
 try{renderMonthly()}catch(e){console.error('Monthly report error',e)}
})();
</script>

<script id="tw-step231-expense-tracking">
(function(){
 const previousRender=window.render;
 const categories=['Feed & hay','Bedding & supplies','Veterinary','Breeding stock','Equipment','Housing & maintenance','Shows & transport','Other'];
 const money=n=>(n/100).toLocaleString('en-US',{style:'currency',currency:'USD'});
 const validDate=v=>/^\d{4}-\d{2}-\d{2}$/.test(v)&&!Number.isNaN(new Date(v+'T12:00:00').getTime());
 const expenses=()=>Array.isArray(db.expenses)?db.expenses:[];
 const mk=(tag,txt)=>{const n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;return n;};
 function draw(){
  if(page!=='Home')return;
  const root=document.getElementById('view');if(!root)return;
  root.querySelector('#tw-step231-expenses')?.remove();
  const section=mk('section');section.id='tw-step231-expenses';section.className='card';
  section.append(mk('h3','Rabbitry Expenses'));
  section.append(mk('p','Record expenses paid for the rabbitry. These do not change sales or customer payments.'));
  const form=mk('form');form.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end';
  function field(title,input){
   const label=mk('label',title);label.style.display='block';input.style.cssText='display:block;width:100%;box-sizing:border-box;margin-top:5px';label.append(input);form.append(label);return input;
  }
  const date=mk('input');date.type='date';date.required=true;
  const today=new Date();date.value=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-');
  field('Date paid',date);
  const category=mk('select');categories.forEach(x=>{const o=mk('option',x);o.value=x;category.append(o)});field('Category',category);
  const amount=mk('input');amount.type='number';amount.min='0.01';amount.step='0.01';amount.placeholder='0.00';amount.required=true;field('Amount ($)',amount);
  const notes=mk('input');notes.type='text';notes.maxLength=240;notes.placeholder='Optional description';field('Notes',notes);
  const submit=mk('button','Add Expense');submit.type='submit';submit.className='primary';form.append(submit);
  form.onsubmit=e=>{
   e.preventDefault();
   const n=Number(amount.value),cents=Math.round(n*100);
   if(!validDate(date.value)||!Number.isFinite(n)||n<=0||!Number.isSafeInteger(cents)||cents<=0){alert('Enter a valid date and positive amount.');return;}
   const old=db.expenses;
   db.expenses=[...expenses(),{id:'exp-'+Date.now()+'-'+Math.random().toString(36).slice(2),date:date.value,category:category.value,amountCents:cents,notes:notes.value.trim()}];
   try{save();window.render()}catch(err){if(old===undefined)delete db.expenses;else db.expenses=old;alert('Could not save expense. Your previous records were kept.');}
  };
  section.append(form);
  const entries=expenses().slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const total=entries.reduce((n,e)=>n+(Number.isSafeInteger(e.amountCents)?e.amountCents:0),0);
  section.append(mk('h4','Total recorded expenses: '+money(total)));
  if(!entries.length){section.append(mk('p','No expenses recorded yet.'))}
  else{
   const wrap=mk('div');wrap.style.overflowX='auto';
   const table=mk('table');table.style.width='100%';
   const header=mk('tr');['Date','Category','Amount','Notes',''].forEach(x=>header.append(mk('th',x)));table.append(header);
   entries.forEach(entry=>{
    const tr=mk('tr');
    [entry.date||'',entry.category||'',money(entry.amountCents||0),entry.notes||''].forEach(v=>{const td=mk('td',v);td.style.padding='8px';tr.append(td)});
    const td=mk('td'),del=mk('button','Delete');del.type='button';
    del.onclick=()=>{
     if(!confirm('Delete this expense record?'))return;
     const old=db.expenses;
     db.expenses=expenses().filter(x=>x.id!==entry.id);
     try{save();window.render()}catch(e){db.expenses=old;alert('Unable to delete expense.')}
    };
    td.append(del);tr.append(td);table.append(tr);
   });
   wrap.append(table);section.append(wrap);
  }
  const anchor=root.querySelector('#tw-step229-monthly');
  if(anchor)anchor.insertAdjacentElement('afterend',section);else root.append(section);
 }
 window.render=function(){const result=previousRender.apply(this,arguments);try{draw()}catch(e){console.error('Expense view error',e)}return result};
 try{draw()}catch(e){console.error('Expense view error',e)}
})();

<script id="tw-step233-profit-loss">

 const cents=v=>Number.isSafeInteger(v)?v:0;
 const valid=d=>{if(typeof d!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(d))return false;const [y,m,day]=d.split('-').map(Number),t=new Date(y,m-1,day);return t.getFullYear()===y&&t.getMonth()===m-1&&t.getDate()===day;};
 const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
 function draw(){
  const root=document.getElementById('view');if(!root)return;
  root.querySelector('#tw-step233-pl')?.remove();
  if(page!=='Financials')return;
  const current=today();
  const included=d=>period==='all'||(valid(d)&&(period==='month'?d.slice(0,7)===current.slice(0,7):period==='year'?d.slice(0,4)===current.slice(0,4):(!from||d>=from)&&(!to||d<=to)));
  let revenue=0,expenseTotal=0,undated=0;
  const categoryTotals=new Map();
  for(const rabbit of db.rabbits||[]){
   if(!rabbit?.litterId)continue;
   const reservation=rabbit.kitReservation||{};
   const payments=Array.isArray(rabbit.kitPayments)&&rabbit.kitPayments.length?rabbit.kitPayments:(cents(reservation.depositCents)>0?[{amountCents:reservation.depositCents,date:reservation.date||''}]:[]);
   for(const payment of payments){if(included(payment.date))revenue+=cents(payment.amountCents);else if(period!=='all'&&!valid(payment.date)&&cents(payment.amountCents))undated++;}
  }
  for(const entry of Array.isArray(db.expenses)?db.expenses:[]){
   if(included(entry.date)){const value=cents(entry.amountCents);expenseTotal+=value;const category=entry.category||'Other';categoryTotals.set(category,(categoryTotals.get(category)||0)+value);}
   else if(period!=='all'&&!valid(entry.date)&&cents(entry.amountCents))undated++;
  }
  const mk=(tag,value)=>{const el=document.createElement(tag);if(value!==undefined)el.textContent=value;return el};
  const section=mk('section');section.id='tw-step233-pl';section.className='card';section.append(mk('h3','Profit & Loss Summary'));
  section.append(mk('p','Cash-basis overview: payments collected minus expenses paid. Unpaid sales balances are not counted as income.'));
  const controls=mk('div');controls.style.cssText='display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:12px 0';
  const label=mk('label','Period: '),select=mk('select');
  [['all','All time'],['month','This month'],['year','This year'],['custom','Custom dates']].forEach(([v,t])=>{const opt=mk('option',t);opt.value=v;select.append(opt)});
  select.value=period;select.onchange=()=>{period=select.value;draw()};label.append(select);controls.append(label);
  if(period==='custom'){
   const dates=mk('div');dates.style.cssText='display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;width:100%';
   [['From',from,v=>from=v],['To',to,v=>to=v]].forEach(([title,value,update])=>{const l=mk('label',title),input=mk('input');l.style.cssText='display:flex;flex-direction:column;gap:5px;min-width:0';input.type='date';input.value=value;input.style.cssText='width:100%;min-width:0;box-sizing:border-box';input.onchange=()=>{update(input.value);draw()};l.append(input);dates.append(l)});
   controls.append(dates);
  }
  section.append(controls);
  const stats=mk('div');stats.className='stats';
  [['Payments collected',revenue],['Expenses paid',expenseTotal],['Net cash profit / loss',revenue-expenseTotal]].forEach(([label,value])=>{const tile=mk('div');tile.className='card stat';tile.append(mk('strong',money(value)),document.createTextNode(label));stats.append(tile)});
  section.append(stats);
  section.append(mk('h4','Expenses by category'));
  if(!categoryTotals.size)section.append(mk('p','No expenses recorded for this period.'));
  else{const wrap=mk('div');wrap.style.overflowX='auto';const table=mk('table');table.style.width='100%';const head=mk('tr');['Category','Amount'].forEach(t=>head.append(mk('th',t)));table.append(head);
   [...categoryTotals].sort((a,b)=>b[1]-a[1]).forEach(([category,value])=>{const tr=mk('tr');[category,money(value)].forEach(t=>{const td=mk('td',t);td.style.padding='8px';tr.append(td)});table.append(tr)});wrap.append(table);section.append(wrap);}
  if(undated)section.append(mk('p',undated+' payment or expense record(s) have no valid date and are excluded from this date range.'));
  section.append(mk('p','This is a simple operational summary, not a tax-ready accounting statement. It does not account for inventory, depreciation, or other adjustments.'));
  const anchor=root.querySelector('#tw-step226-dashboard');
  if(anchor)anchor.insertAdjacentElement('afterend',section);else root.prepend(section);
 }
 window.render=function(){const result=priorRender.apply(this,arguments);try{draw()}catch(e){console.error('Profit & loss summary error',e)}return result};
 try{draw()}catch(e){console.error('Profit & loss summary error',e)}
})();
</script>
