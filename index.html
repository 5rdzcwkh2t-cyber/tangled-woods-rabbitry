<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315d4b"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" type="image/png" href="icon-192.png"><title>Tangled Woods Rabbitry</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#263b32;background:#f6f5f0}*{box-sizing:border-box}body{margin:0}header{background:#315d4b;color:white;padding:20px max(18px,env(safe-area-inset-left));}header h1{font-size:22px;margin:4px 0}header small{opacity:.8}main{max-width:900px;margin:auto;padding:18px 16px 90px}.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0}.tabs button{white-space:nowrap}.tabs button.active{background:#315d4b;color:white}button,.btn{border:0;border-radius:12px;padding:11px 15px;background:#e5eae5;color:#263b32;font-size:15px;cursor:pointer}button.primary{background:#315d4b;color:white}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:white;border:1px solid #e5e9e3;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 6px #00000005}.stat strong{display:block;font-size:28px;color:#315d4b}.muted{color:#6d7b73;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.listitem{width:100%;text-align:left;background:white;border:1px solid #e1e6df;margin:5px 0;padding:14px;border-radius:12px}.listitem strong{display:block}input,select,textarea{width:100%;font:inherit;border:1px solid #cdd8cf;border-radius:10px;padding:12px;margin:5px 0 13px;background:white}label{display:block;font-size:13px;color:#53695b}h2{font-size:21px}h3{font-size:16px}.pill{background:#e8f1e9;border-radius:20px;padding:4px 8px;font-size:12px}.ped{display:grid;grid-template-columns:repeat(4,minmax(125px,1fr));gap:8px;overflow:auto}.ped .card{font-size:12px;padding:10px;min-width:125px}.ped .card strong{display:block}footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;padding:8px;text-align:center;color:#667;font-size:12px}#view{min-height:55vh}@media(min-width:650px){.stats{grid-template-columns:repeat(4,1fr)}}@media print{header,.tabs,footer,button{display:none!important}main{max-width:none}.ped{overflow:visible}}

.ped{display:flex;gap:10px;overflow-x:auto;align-items:stretch}.pedcol{flex:1;min-width:170px}.pednode{background:white;border:1px solid #dce6dc;border-radius:10px;padding:9px;margin:7px 0;min-height:48px;overflow-wrap:anywhere}.pednode strong{font-size:12px;display:block}.pednode small{font-size:10px;display:block;color:#66776a}.pednode.ambiguous{border-color:#d3a148}.pednode.unmatched{border-style:dashed}.pednode.unknown{opacity:.55}.stat{padding:12px;background:#f3f7f1;border-radius:12px}.stat strong{display:block;font-size:23px;color:#315d4b} @media print{.no-print{display:none!important}footer{display:none!important}body{background:white}.ped{overflow:visible;gap:4px}.pedcol{min-width:0}.pednode{padding:3px;margin:3px 0;min-height:0;break-inside:avoid}.pednode strong{font-size:8px}.pednode small{font-size:7px} .pedcol h3{font-size:10px}main{padding:0}.card{box-shadow:none}}

header.brand-header{display:flex;align-items:center;gap:14px}.brand-logo{width:76px;height:76px;object-fit:cover;border-radius:50%;background:#f6f1e6;border:2px solid #e6d8b7;flex-shrink:0}.brand-header h1{margin:3px 0}.pedigree-brand{display:flex;align-items:center;gap:14px}.pedigree-brand img{width:94px;height:94px;object-fit:contain;border-radius:50%}@media print{header.brand-header{display:none!important}.pedigree-brand{break-inside:avoid}.pedigree-brand img{width:75px;height:75px}}
</style></head><body><header class="brand-header"><img class="brand-logo" src="tangled-woods-logo.jpg" alt="Tangled Woods Rabbitry logo"><div><small>TANGLED WOODS</small><h1>Rabbitry Manager</h1><small>Private breeding & pedigree records</small></div></header><main><div class="tabs" id="tabs"></div><section id="view"></section></main><footer>Version 3.2 · Local records · No automatic sync</footer><script src="seed.js"></script><script>
const KEY='tangledwoods-data-v2';let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(SEED)}catch(e){db=structuredClone(SEED)};if(!Array.isArray(db.breedings))db.breedings=[];let page='Home',query='',selected=null;const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const name=r=>[r.Prefix,r.Name].filter(Boolean).join(' ');const options=['Home','Rabbits','Litters','Breeding','Pedigrees','Import','Backup'];const el=id=>document.getElementById(id);function nav(p){page=p;selected=null;query='';render()}function render(){el('tabs').innerHTML=options.map(x=>`<button class="${page===x?'active':''}" onclick="nav('${x}')">${x}</button>`).join('');let v=el('view');if(page==='Home')v.innerHTML=`<h2>Welcome back</h2><div class="stats"><div class="card stat"><strong>${db.rabbits.length}</strong>Rabbit records</div><div class="card stat"><strong>${db.litters.length}</strong>Litters</div><div class="card stat"><strong>${db.rabbits.filter(x=>x.Sex?.toLowerCase()==='doe').length}</strong>Does</div><div class="card stat"><strong>${db.rabbits.filter(x=>x.Sex?.toLowerCase()==='buck').length}</strong>Bucks</div></div><div class="card"><h3>Quick actions</h3><button class="primary" onclick="nav('Rabbits')">Browse rabbits</button> <button onclick="nav('Breeding')">Breeding planner</button> <button onclick="nav('Litters')">View litters</button></div><div class="card"><h3>Migration status</h3><p>Import your Everbreed CSV files from the Import tab. Pedigree links are matched by name only where unambiguous. Unmatched ancestors need manual verification. Device syncing is not enabled.</p></div>`;
if(page==='Breeding')breeding();if(page==='Rabbits')listing('rabbits');if(page==='Litters')listing('litters');if(page==='Pedigrees')v.innerHTML=`<h2>Pedigree viewer</h2><p class="muted">Choose a rabbit to view its parents and known ancestors. Names that cannot be matched remain as text.</p><input id="search" placeholder="Search rabbit name or tattoo" oninput="filterPed(this.value)"><div id="results"></div>`;if(page==='Pedigrees')filterPed('');if(page==='Import')v.innerHTML=`<h2>Import Everbreed CSV</h2><div class="card"><p>Choose an Everbreed <strong>Rabbits/Breeders</strong> or <strong>Litters</strong> CSV. The file is read on this device only; it is not uploaded to GitHub or a server.</p><label>Import type<select id="importType" onchange="if(el('importFile').files.length)previewCSV()"><option value="rabbits">Rabbits / Breeders</option><option value="litters">Litters</option></select></label><label>Choose CSV<input id="importFile" type="file" accept=".csv,text/csv" onchange="previewCSV()"></label><div id="importPreview" class="muted">Select a file to preview it before importing.</div></div><div class="card"><h3>Before importing</h3><p>Use Backup → Download backup first. Import replaces records of the selected type on this device; the other type remains unchanged. Existing edits in that category will be replaced.</p><p class="muted">No cloud syncing yet. Repeat import on another device if needed, or transfer a JSON backup.</p></div>`;
if(page==='Backup')v.innerHTML=`<h2>Data & backups</h2><div class="card"><p>Export a complete JSON backup after edits. Store it somewhere safe, such as Files or iCloud Drive.</p><button class="primary" onclick="backup()">Download backup</button><h3>Restore backup</h3><input type="file" accept="application/json,.json" onchange="restore(event)"><p class="muted">Restoring replaces all current records on this device.</p></div><div class="card"><h3>Important</h3><p>This prototype saves data in this browser. Clearing website data may erase changes. iPhone and iPad do not sync yet.</p></div>`;}
function listing(type){let isR=type==='rabbits';el('view').innerHTML=`<div class="row"><h2>${isR?'Rabbits':'Litters'}</h2><button class="primary" onclick="edit('${type}',-1)">+ Add</button></div><input id="search" placeholder="Search by name, breed, tattoo, parent..." value="${esc(query)}" oninput="filterList('${type}',this.value)"><div class="muted" id="count"></div><div id="results"></div>`;filterList(type,query)}function filterList(type,q){query=q;let a=db[type].map((x,i)=>({...x,__index:i})).filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(q.toLowerCase())));el('count').textContent=`${a.length} matching records`;el('results').innerHTML=a.slice(0,100).map(x=>`<button class="listitem" onclick="detail('${type}',${x.__index})"><strong>${esc(name(x)||'Unnamed')}</strong><span class="muted">${esc(x.Breed||'')} · ${esc(type==='rabbits'?x.Tattoo||x.Sex:x.Born||x.Bred)} · ${esc(type==='rabbits'?x.Status:x['Total Kits']+' kits')}</span></button>`).join('')+(a.length>100?'<p class="muted">Showing first 100 results; narrow your search.</p>':'')}
function detail(type,i){let x=db[type][i];selected={type,i};el('view').innerHTML=`<button onclick="render()">← Back</button><div class="card"><div class="row"><h2>${esc(name(x)||'Unnamed')}</h2><button onclick="edit('${type}',${i})">Edit</button></div>${Object.entries(x).filter(([k,v])=>!k.startsWith('_')&&v).map(([k,v])=>`<p><span class="muted">${esc(k)}:</span> ${esc(v)}</p>`).join('')}${type==='rabbits'?`<button class="primary" onclick="pedigree(${i})">View pedigree</button>`:''}</div>`}
function edit(type,i){let x=i<0?{}:db[type][i];let keys=type==='rabbits'?['Prefix','Name','Sex','Tattoo','Breed','Color','DoB','Father','Mother','Weight','Status','Notes']:['Prefix','Name','Breed','Father','Mother','Bred','Born','Total Kits','Sold Kits','Died Kits','Notes'];el('view').innerHTML=`<button onclick="render()">← Cancel</button><h2>${i<0?'Add':'Edit'} ${type==='rabbits'?'rabbit':'litter'}</h2><form id="editform">${keys.map(k=>`<label>${esc(k)}${k==='Notes'?`<textarea name="${k}">${esc(x[k]||'')}</textarea>`:`<input name="${k}" value="${esc(x[k]||'')}">`}</label>`).join('')}<button class="primary" type="submit">Save record</button></form>`;el('editform').onsubmit=e=>{e.preventDefault();let data={...x};new FormData(e.target).forEach((v,k)=>data[k]=v);if(i<0){data._id=(type==='rabbits'?'r':'l')+Date.now();db[type].push(data)}else db[type][i]=data;try{save();nav(type==='rabbits'?'Rabbits':'Litters')}catch(err){alert('Storage is full. Export a backup and use a hosted database.')}}}
function cleanParent(s){let t=String(s||'').trim();if(t.startsWith('[')){try{let a=JSON.parse(t);if(Array.isArray(a))t=a.join(' ')}catch(e){}}return t.replace(/\s*\([^)]*\)\s*$/,'').trim()}
function matchInfo(s){let t=cleanParent(s);if(!t)return {record:null,label:'Unknown',status:'unknown'};let norm=v=>String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'');let a=db.rabbits.filter(x=>norm(name(x))===norm(t));if(a.length===0)a=db.rabbits.filter(x=>norm(x.Name)===norm(t));if(a.length===1)return {record:a[0],label:name(a[0]),status:'matched'};return {record:null,label:t,status:a.length?'ambiguous':'unmatched'}}
function pedigree(i){let root=db.rabbits[i],gens=Number(window.pedGens||3);let nodes=[{record:root,label:name(root),status:'matched',path:0,level:0}];for(let depth=1;depth<gens;depth++){let prior=nodes.filter(n=>n.level===depth-1);for(let n of prior){for(let [idx,key] of ['Father','Mother'].entries()){let info=n.record?matchInfo(n.record[key]):{record:null,label:'Unknown',status:'unknown'};nodes.push({...info,path:n.path*2+idx,level:depth})}}}let columns=[];for(let d=0;d<gens;d++){let group=nodes.filter(n=>n.level===d);columns.push(`<div class="pedcol"><h3>${['Rabbit','Parents','Grandparents','Great-grandparents','4th great line'][d]||'Ancestors'}</h3>${group.map(n=>`<div class="pednode ${n.status}"><strong>${esc(n.label||'Unknown')}</strong>${n.record?`<small>${esc(n.record.Tattoo||'')} ${esc(n.record.Color||'')} ${esc(n.record.Breed||'')}</small>`:''}${n.status!=='matched'?`<small>${n.status==='ambiguous'?'⚠ Multiple possible matches':n.status==='unmatched'?'Not found in imported rabbits':'Not recorded'}</small>`:''}</div>`).join('')}</div>`)}el('view').innerHTML=`<button onclick="nav('Pedigrees')">← Pedigrees</button><div class="row"><h2>${esc(name(root))}</h2><button onclick="window.print()">Print / Save PDF</button></div><label class="no-print">Generations <select onchange="window.pedGens=Number(this.value);pedigree(${i})"><option value="3" ${gens===3?'selected':''}>3 generations</option><option value="5" ${gens===5?'selected':''}>5 generations</option></select></label><div class="card"><div class="pedigree-brand"><img src="tangled-woods-logo.jpg" alt="Tangled Woods Rabbitry logo"><strong>Tangled Woods Rabbitry · Pedigree</strong></div><p>${esc(name(root))} · ${esc(root.Tattoo||'No tattoo')} · ${esc(root.Breed||'')} · ${esc(root.Color||'')}</p><p class="muted">Unmatched and ambiguous parent names are not verified. Printed output must be reviewed before issuing as a certificate.</p></div><div class="ped ped${gens}">${columns.join('')}</div><div class="card"><p>I certify that this pedigree is correct to the best of my knowledge.</p><p>Signature: _________________________ Date: _____________</p></div>`}
function parseDate(v){let s=String(v||'').trim(),m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m){let d=new Date(+m[3],+m[1]-1,+m[2]);return d.getFullYear()===+m[3]&&d.getMonth()===+m[1]-1&&d.getDate()===+m[2]?d:null}if(/^\d{4}-\d\d-\d\d$/.test(s)){let d=new Date(s+'T12:00:00');return Number.isNaN(+d)?null:d}return null}
function dateISO(d){let n=new Date(d);return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function rabbitChoices(sex){return db.rabbits.map((r,i)=>({r,i})).filter(y=>String(y.r.Sex||'').toLowerCase()===sex).map(y=>`<option value="${esc(y.r._id||'r-import-'+y.i)}">${esc(name(y.r)||'Unnamed')} · ${esc(y.r.Tattoo||'No tattoo')}</option>`).join('')}
function rabbitLabel(id){let r=db.rabbits.find((r,i)=>(r._id||'r-import-'+i)===id);return r?name(r):'Missing rabbit'}
function newBreeding(i=-1){let x=i<0?{}:db.breedings[i];el('view').innerHTML=`<button onclick="nav('Breeding')">← Cancel</button><h2>${i<0?'New':'Edit'} breeding</h2><div class="card"><p class="muted">Select the parents from imported records. This creates a breeding record, not a litter.</p><form id="breedForm"><label>Doe<select name="doeId" required><option value="">Choose doe…</option>${rabbitChoices('doe')}</select></label><label>Buck<select name="buckId" required><option value="">Choose buck…</option>${rabbitChoices('buck')}</select></label><label>Breeding date<input name="date" type="date" required value="${esc(x.date||dateISO(new Date()))}"></label><div class="card" id="duePreview" aria-live="polite"></div><label>Status<select name="status">${['Bred','Confirmed pregnant','Kindled','Unsuccessful','Cancelled'].map(v=>`<option value="${v}">${v}</option>`).join('')}</select></label><label>Actual kindling date (optional)<input name="kindledDate" type="date" value="${esc(x.kindledDate||'')}"></label><label>Notes<textarea name="notes">${esc(x.notes||'')}</textarea></label><button class="primary" type="submit">${i<0?'Save breeding':'Save changes'}</button></form></div>`;let f=el('breedForm');f.elements.doeId.value=x.doeId||'';f.elements.buckId.value=x.buckId||'';f.elements.status.value=x.status||'Bred';let update=()=>{let d=parseDate(f.elements.date.value);el('duePreview').textContent=d?'Estimated kindling: '+dateISO(addDays(d,31))+' (typical range '+dateISO(addDays(d,28))+'–'+dateISO(addDays(d,33))+')':'Select a breeding date'};f.elements.date.addEventListener('input',update);update();f.onsubmit=e=>{e.preventDefault();let z=Object.fromEntries(new FormData(f));if(!db.rabbits.some(r=>r._id===z.doeId&&String(r.Sex).toLowerCase()==='doe')||!db.rabbits.some(r=>r._id===z.buckId&&String(r.Sex).toLowerCase()==='buck')){alert('Choose a valid doe and buck');return}if(z.doeId===z.buckId){alert('Choose two different rabbits');return}let previous=JSON.stringify(db.breedings);let rec={...x,...z,_id:x._id||'b-'+Date.now()};if(i<0)db.breedings.push(rec);else db.breedings[i]=rec;try{save();nav('Breeding')}catch(err){db.breedings=JSON.parse(previous);alert('Could not save. Check device storage and export a backup.')}}}
function removeBreeding(i){if(!confirm('Delete this breeding record? This does not delete rabbits or litters.'))return;let old=db.breedings.slice();db.breedings.splice(i,1);try{save();nav('Breeding')}catch(e){db.breedings=old;alert('Could not delete: '+e.message)}}
function breeding(){let today=new Date();today.setHours(0,0,0,0);let active=db.breedings.map((x,i)=>({x,i,date:parseDate(x.date)})).filter(y=>y.date&&!['Kindled','Unsuccessful','Cancelled'].includes(y.x.status)&&!y.x.kindledDate).map(y=>({...y,due:addDays(y.date,31)})).sort((a,b)=>a.due-b.due);let upcoming=active.filter(y=>y.due>=today&&y.due<=addDays(today,45)),overdue=active.filter(y=>y.due<today);let recent=db.litters.map((x,i)=>({x,i,date:parseDate(x.Born)})).filter(y=>y.date).sort((a,b)=>b.date-a.date).slice(0,12);el('view').innerHTML=`<div class="row"><h2>Breeding planner</h2><button class="primary" onclick="newBreeding()">+ New breeding</button></div><div class="card"><h3>Kindling estimates</h3><p class="muted">Estimated 31 days after breeding (typical range 28–33 days). Confirm dates with your own records and veterinary guidance.</p><div class="stats"><div class="stat"><strong>${upcoming.length}</strong>Next 45 days</div><div class="stat"><strong>${overdue.length}</strong>Past estimated date</div><div class="stat"><strong>${db.breedings.length}</strong>Breeding records</div></div></div><h3>Upcoming expected kindling</h3>${upcoming.length?upcoming.map(y=>`<button class="listitem" onclick="newBreeding(${y.i})"><strong>${esc(rabbitLabel(y.x.doeId))} × ${esc(rabbitLabel(y.x.buckId))}</strong><span class="muted">Est. ${dateISO(y.due)} · ${esc(y.x.status)}</span></button>`).join(''):'<div class="card muted">No upcoming kindling dates recorded. Add a breeding to begin planning.</div>'}<h3>Breeding history</h3>${db.breedings.length?db.breedings.map((x,i)=>({x,i})).reverse().map(y=>`<div class="card"><strong>${esc(rabbitLabel(y.x.doeId))} × ${esc(rabbitLabel(y.x.buckId))}</strong><p class="muted">Bred ${esc(y.x.date)} · ${esc(y.x.status)}${y.x.kindledDate?' · Kindled '+esc(y.x.kindledDate):''}</p><button onclick="newBreeding(${y.i})">Edit</button> <button onclick="removeBreeding(${y.i})">Delete</button></div>`).join(''):'<p class="muted">No separate breeding records yet. Historical imported litters remain below.</p>'}<h3>Recent recorded litters</h3>${recent.map(y=>`<button class="listitem" onclick="detail('litters',${y.i})"><strong>${esc(name(y.x)||'Unnamed litter')}</strong><span class="muted">Born ${dateISO(y.date)} · ${esc(y.x['Total Kits']||'?')} kits</span></button>`).join('')||'<p>No recorded births yet.</p>'}<div class="card"><h3>Reminders</h3><p>Dates appear when the app opens. Push notifications and automatic device syncing are not enabled.</p></div>`}
function filterPed(q){let a=db.rabbits.map((x,i)=>({...x,__index:i})).filter(x=>[name(x),x.Tattoo].some(s=>String(s||'').toLowerCase().includes(q.toLowerCase())));el('results').innerHTML=a.slice(0,60).map(x=>`<button class="listitem" onclick="pedigree(${x.__index})"><strong>${esc(name(x))}</strong><span class="muted">${esc(x.Tattoo||'')} · ${esc(x.Breed||'')}</span></button>`).join('')}
let pendingCSV=null;
function parseCSV(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(quoted){if(c==='"'&&text[i+1]==='"'){field+='"';i++}else if(c==='"')quoted=false;else field+=c}else if(c==='"')quoted=true;else if(c===','){row.push(field);field=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(x=>x.trim()))rows.push(row);row=[];field=''}else field+=c}if(quoted)throw Error('Unclosed quoted field');if(field!==''||row.length){row.push(field);if(row.some(x=>x.trim()))rows.push(row)}if(!rows.length)throw Error('Empty CSV');let headers=rows.shift().map(x=>x.trim());if(new Set(headers).size!==headers.length)throw Error('Duplicate column headers');return {headers,records:rows.map(r=>Object.fromEntries(headers.map((h,i)=>[h,r[i]??''])))};}
async function previewCSV(){pendingCSV=null;let f=el('importFile').files[0],box=el('importPreview');if(!f)return;try{if(f.size>15*1024*1024)throw Error('File exceeds 15 MB');let parsed=parseCSV(await f.text()),type=el('importType').value,required=type==='rabbits'?['Name','Father','Mother','Breed']:['Name','Father','Mother','Total Kits'];let missing=required.filter(h=>!parsed.headers.includes(h));if(missing.length)throw Error('This does not look like a '+type+' export. Missing: '+missing.join(', '));if(!parsed.records.length)throw Error('No records found');pendingCSV={type,records:parsed.records};box.innerHTML=`<p><strong>${parsed.records.length} records found</strong> · ${parsed.headers.length} columns</p><p>Columns: ${esc(parsed.headers.join(', '))}</p><p>Preview: ${esc([parsed.records[0].Prefix,parsed.records[0].Name].filter(Boolean).join(' '))}</p><button class="primary" onclick="commitCSV()">Replace ${type} records with this CSV</button>`;}catch(err){box.textContent='Could not preview CSV: '+err.message;}}
function commitCSV(){if(!pendingCSV)return;let {type,records}=pendingCSV;if(!confirm('Replace all '+db[type].length+' existing '+type+' records on THIS DEVICE with '+records.length+' imported records? Download a backup first.'))return;let previous=db[type];db[type]=records.map((r,i)=>({...r,_id:type[0]+'-import-'+i}));try{save();pendingCSV=null;alert('Imported '+records.length+' '+type+' records on this device. Download a JSON backup now.');nav('Home')}catch(err){db[type]=previous;alert('Could not save import. Device storage may be full: '+err.message)}}
function backup(){let blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tangled-woods-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}async function restore(e){let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.rabbits)||!Array.isArray(data.litters))throw Error('Invalid backup');if(confirm('Replace all current local data with this backup?')){db={rabbits:data.rabbits,litters:data.litters,breedings:Array.isArray(data.breedings)?data.breedings:[]};save();nav('Home')}}catch(err){alert('Could not read backup: '+err.message)}}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
