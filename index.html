<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315d4b"><link rel="manifest" href="manifest.webmanifest"><title>Tangled Woods Rabbitry</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#263b32;background:#f6f5f0}*{box-sizing:border-box}body{margin:0}header{background:#315d4b;color:white;padding:20px max(18px,env(safe-area-inset-left));}header h1{font-size:22px;margin:4px 0}header small{opacity:.8}main{max-width:900px;margin:auto;padding:18px 16px 90px}.tabs{display:flex;gap:8px;overflow:auto;padding:12px 0}.tabs button{white-space:nowrap}.tabs button.active{background:#315d4b;color:white}button,.btn{border:0;border-radius:12px;padding:11px 15px;background:#e5eae5;color:#263b32;font-size:15px;cursor:pointer}button.primary{background:#315d4b;color:white}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:white;border:1px solid #e5e9e3;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 2px 6px #00000005}.stat strong{display:block;font-size:28px;color:#315d4b}.muted{color:#6d7b73;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.listitem{width:100%;text-align:left;background:white;border:1px solid #e1e6df;margin:5px 0;padding:14px;border-radius:12px}.listitem strong{display:block}input,select,textarea{width:100%;font:inherit;border:1px solid #cdd8cf;border-radius:10px;padding:12px;margin:5px 0 13px;background:white}label{display:block;font-size:13px;color:#53695b}h2{font-size:21px}h3{font-size:16px}.pill{background:#e8f1e9;border-radius:20px;padding:4px 8px;font-size:12px}.ped{display:grid;grid-template-columns:repeat(4,minmax(125px,1fr));gap:8px;overflow:auto}.ped .card{font-size:12px;padding:10px;min-width:125px}.ped .card strong{display:block}footer{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;padding:8px;text-align:center;color:#667;font-size:12px}#view{min-height:55vh}@media(min-width:650px){.stats{grid-template-columns:repeat(4,1fr)}}@media print{header,.tabs,footer,button{display:none!important}main{max-width:none}.ped{overflow:visible}}
</style></head><body><header><small>TANGLED WOODS</small><h1>🐇 Rabbitry Manager</h1><small>Private breeding & pedigree records</small></header><main><div class="tabs" id="tabs"></div><section id="view"></section></main><footer>Local prototype · Export backups regularly · Sync not yet enabled</footer><script src="seed.js"></script><script>
const KEY='tangledwoods-data-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(SEED)}catch(e){db=structuredClone(SEED)};let page='Home',query='',selected=null;const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const name=r=>[r.Prefix,r.Name].filter(Boolean).join(' ');const options=['Home','Rabbits','Litters','Pedigrees','Backup'];const el=id=>document.getElementById(id);function nav(p){page=p;selected=null;query='';render()}function render(){el('tabs').innerHTML=options.map(x=>`<button class="${page===x?'active':''}" onclick="nav('${x}')">${x}</button>`).join('');let v=el('view');if(page==='Home')v.innerHTML=`<h2>Welcome back</h2><div class="stats"><div class="card stat"><strong>${db.rabbits.length}</strong>Rabbit records</div><div class="card stat"><strong>${db.litters.length}</strong>Litters</div><div class="card stat"><strong>${db.rabbits.filter(x=>x.Sex?.toLowerCase()==='doe').length}</strong>Does</div><div class="card stat"><strong>${db.rabbits.filter(x=>x.Sex?.toLowerCase()==='buck').length}</strong>Bucks</div></div><div class="card"><h3>Quick actions</h3><button class="primary" onclick="nav('Rabbits')">Browse rabbits</button> <button onclick="nav('Litters')">View litters</button></div><div class="card"><h3>Migration status</h3><p>Rabbit and litter CSV records loaded. Pedigree links are matched by name only where unambiguous. Full ancestral imports and device syncing are future steps.</p></div>`;
if(page==='Rabbits')listing('rabbits');if(page==='Litters')listing('litters');if(page==='Pedigrees')v.innerHTML=`<h2>Pedigree viewer</h2><p class="muted">Choose a rabbit to view its parents and known ancestors. Names that cannot be matched remain as text.</p><input id="search" placeholder="Search rabbit name or tattoo" oninput="filterPed(this.value)"><div id="results"></div>`;if(page==='Pedigrees')filterPed('');if(page==='Backup')v.innerHTML=`<h2>Data & backups</h2><div class="card"><p>Export a complete JSON backup after edits. Store it somewhere safe, such as Files or iCloud Drive.</p><button class="primary" onclick="backup()">Download backup</button><h3>Restore backup</h3><input type="file" accept="application/json,.json" onchange="restore(event)"><p class="muted">Restoring replaces all current records on this device.</p></div><div class="card"><h3>Important</h3><p>This prototype saves data in this browser. Clearing website data may erase changes. iPhone and iPad do not sync yet.</p></div>`;}
function listing(type){let isR=type==='rabbits';el('view').innerHTML=`<div class="row"><h2>${isR?'Rabbits':'Litters'}</h2><button class="primary" onclick="edit('${type}',-1)">+ Add</button></div><input id="search" placeholder="Search by name, breed, tattoo, parent..." value="${esc(query)}" oninput="filterList('${type}',this.value)"><div class="muted" id="count"></div><div id="results"></div>`;filterList(type,query)}function filterList(type,q){query=q;let a=db[type].map((x,i)=>({...x,__index:i})).filter(x=>Object.values(x).some(v=>String(v).toLowerCase().includes(q.toLowerCase())));el('count').textContent=`${a.length} matching records`;el('results').innerHTML=a.slice(0,100).map(x=>`<button class="listitem" onclick="detail('${type}',${x.__index})"><strong>${esc(name(x)||'Unnamed')}</strong><span class="muted">${esc(x.Breed||'')} · ${esc(type==='rabbits'?x.Tattoo||x.Sex:x.Born||x.Bred)} · ${esc(type==='rabbits'?x.Status:x['Total Kits']+' kits')}</span></button>`).join('')+(a.length>100?'<p class="muted">Showing first 100 results; narrow your search.</p>':'')}
function detail(type,i){let x=db[type][i];selected={type,i};el('view').innerHTML=`<button onclick="render()">← Back</button><div class="card"><div class="row"><h2>${esc(name(x)||'Unnamed')}</h2><button onclick="edit('${type}',${i})">Edit</button></div>${Object.entries(x).filter(([k,v])=>!k.startsWith('_')&&v).map(([k,v])=>`<p><span class="muted">${esc(k)}:</span> ${esc(v)}</p>`).join('')}${type==='rabbits'?`<button class="primary" onclick="pedigree(${i})">View pedigree</button>`:''}</div>`}
function edit(type,i){let x=i<0?{}:db[type][i];let keys=type==='rabbits'?['Prefix','Name','Sex','Tattoo','Breed','Color','DoB','Father','Mother','Weight','Status','Notes']:['Prefix','Name','Breed','Father','Mother','Bred','Born','Total Kits','Sold Kits','Died Kits','Notes'];el('view').innerHTML=`<button onclick="render()">← Cancel</button><h2>${i<0?'Add':'Edit'} ${type==='rabbits'?'rabbit':'litter'}</h2><form id="editform">${keys.map(k=>`<label>${esc(k)}${k==='Notes'?`<textarea name="${k}">${esc(x[k]||'')}</textarea>`:`<input name="${k}" value="${esc(x[k]||'')}">`}</label>`).join('')}<button class="primary" type="submit">Save record</button></form>`;el('editform').onsubmit=e=>{e.preventDefault();let data={...x};new FormData(e.target).forEach((v,k)=>data[k]=v);if(i<0){data._id=(type==='rabbits'?'r':'l')+Date.now();db[type].push(data)}else db[type][i]=data;try{save();nav(type==='rabbits'?'Rabbits':'Litters')}catch(err){alert('Storage is full. Export a backup and use a hosted database.')}}}
function match(s){if(!s||s==='[]')return null;let norm=t=>String(t).toLowerCase().replace(/[^a-z0-9]/g,'');let a=db.rabbits.filter(x=>norm(name(x))===norm(s)||norm(x.Name)===norm(s));return a.length===1?a[0]:null}
function pedigree(i){let root=db.rabbits[i];let levels=[[root]],seen=new Set();for(let depth=0;depth<3;depth++){let last=levels.at(-1),next=[];for(let x of last){if(!x){next.push(null,null);continue}for(let k of ['Father','Mother']){let m=match(x[k]);next.push(m|| (x[k]&&x[k]!=='[]'?{Name:x[k],_unmatched:true}:null))}}levels.push(next)}el('view').innerHTML=`<button onclick="nav('Pedigrees')">← Pedigrees</button><div class="row"><h2>${esc(name(root))}</h2><button onclick="print()">Print</button></div><p class="muted">Four displayed generations including the selected rabbit. Unmatched ancestors are shown by name; they are not verified database links.</p><div class="ped">${levels.map((arr,i)=>`<div><h3>${['Rabbit','Parents','Grandparents','Great-grandparents'][i]}</h3>${arr.map(x=>`<div class="card">${x?`<strong>${esc(name(x))}</strong><span class="muted">${x._unmatched?'Unmatched':esc(x.Tattoo||x.Color||'')}</span>`:'<span class="muted">Unknown</span>'}</div>`).join('')}</div>`).join('')}</div>`}
function filterPed(q){let a=db.rabbits.map((x,i)=>({...x,__index:i})).filter(x=>[name(x),x.Tattoo].some(s=>String(s||'').toLowerCase().includes(q.toLowerCase())));el('results').innerHTML=a.slice(0,60).map(x=>`<button class="listitem" onclick="pedigree(${x.__index})"><strong>${esc(name(x))}</strong><span class="muted">${esc(x.Tattoo||'')} · ${esc(x.Breed||'')}</span></button>`).join('')}
function backup(){let blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tangled-woods-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}async function restore(e){let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data.rabbits)||!Array.isArray(data.litters))throw Error('Invalid backup');if(confirm('Replace all current local data with this backup?')){db={rabbits:data.rabbits,litters:data.litters};save();nav('Home')}}catch(err){alert('Could not read backup: '+err.message)}}if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});render();
</script></body></html>
