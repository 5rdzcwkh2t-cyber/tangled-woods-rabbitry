<script id="tw-step239-financials-completion">
(function(){
 const prior=window.render;
 const categories=['Feed & hay','Bedding & supplies','Veterinary','Breeding stock','Equipment','Housing & maintenance','Shows & transport','Other'];
 const money=n=>(n/100).toLocaleString('en-US',{style:'currency',currency:'USD'});
 const mk=(tag,t)=>{const x=document.createElement(tag);if(t!==undefined)x.textContent=t;return x};
 const today=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
 const validDate=v=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;const [y,m,d]=v.split('-').map(Number),a=new Date(y,m-1,d);return a.getFullYear()===y&&a.getMonth()===m-1&&a.getDate()===d};
 const entries=()=>Array.isArray(db.expenses)?db.expenses:[];
 let filter='all',year=today().slice(0,4),editing=null;
 function draw(){
  if(page!=='Financials')return;
  const root=document.getElementById('view');if(!root)return;
  root.querySelector('#tw-step231-expenses')?.remove();
  root.querySelector('#tw-step239-expenses')?.remove();
  const section=mk('section');section.id='tw-step239-expenses';section.className='card';
  section.append(mk('h3','Rabbitry Expenses'));
  section.append(mk('p','Record expenses paid for the rabbitry. Edit or delete mistakes below.'));
  const form=mk('form');form.style.cssText='display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px;align-items:end';
  function field(label,input){const l=mk('label',label);l.style.display='block';input.style.cssText='display:block;width:100%;box-sizing:border-box;margin-top:5px';l.append(input);form.append(l)}
  const original=entries().find(x=>x.id===editing);
  if(editing&&!original)editing=null;
  const date=mk('input');date.type='date';date.required=true;date.value=original?.date||today();field('Date paid',date);
  const category=mk('select');[...new Set([...categories,...entries().map(e=>e.category).filter(Boolean)])].forEach(c=>{const o=mk('option',c);o.value=c;category.append(o)});category.value=original?.category||categories[0];field('Category',category);
  const amount=mk('input');amount.type='number';amount.min='0.01';amount.step='0.01';amount.required=true;amount.placeholder='0.00';amount.value=original?(original.amountCents/100).toFixed(2):'';field('Amount ($)',amount);
  const notes=mk('input');notes.type='text';notes.maxLength=240;notes.value=original?.notes||'';notes.placeholder='Optional description';field('Notes',notes);
  const submit=mk('button',original?'Save Changes':'Add Expense');submit.type='submit';submit.className='primary';form.append(submit);
  if(original){const cancel=mk('button','Cancel Edit');cancel.type='button';cancel.onclick=()=>{editing=null;draw()};form.append(cancel)}
  form.onsubmit=e=>{
   e.preventDefault();
   const n=Number(amount.value),cents=Math.round(n*100);
   if(!validDate(date.value)||!Number.isFinite(n)||n<=0||!Number.isSafeInteger(cents)||cents<=0){alert('Enter a valid date and positive amount.');return}
   const old=db.expenses;
   const updated={id:original?.id||'exp-'+Date.now()+'-'+Math.random().toString(36).slice(2),date:date.value,category:category.value,amountCents:cents,notes:notes.value.trim()};
   db.expenses=original?entries().map(x=>x.id===original.id?updated:x):[...entries(),updated];
   try{save();editing=null;window.render()}catch(err){db.expenses=old;alert('Unable to save expense. Please try again.')}
  };
  section.append(form);
  const controls=mk('div');controls.style.cssText='display:flex;flex-wrap:wrap;gap:12px;align-items:end;margin:18px 0 12px';
  const periodLabel=mk('label','Expense report: '),period=mk('select');
  [['all','All time'],['month','This month'],['year','Selected year']].forEach(([v,t])=>{const o=mk('option',t);o.value=v;period.append(o)});
  period.value=filter;period.onchange=()=>{filter=period.value;draw()};periodLabel.append(period);controls.append(periodLabel);
  if(filter==='year'){const yLabel=mk('label','Year: '),y=mk('input');y.type='number';y.min='1900';y.max='2200';y.step='1';y.value=year;y.style.width='90px';y.onchange=()=>{if(/^\d{4}$/.test(y.value)){year=y.value;draw()}};yLabel.append(y);controls.append(yLabel)}
  const selected=entries().filter(e=>filter==='all'||(filter==='month'?String(e.date||'').slice(0,7)===today().slice(0,7):String(e.date||'').slice(0,4)===year)).slice().sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const total=selected.reduce((sum,e)=>sum+(Number.isSafeInteger(e.amountCents)?e.amountCents:0),0);
  const csvButton=mk('button','Export Expenses CSV');csvButton.type='button';
  csvButton.onclick=()=>{
   const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
   const rows=[['Date','Category','Amount ($)','Notes'],...selected.map(e=>[e.date||'',e.category||'',(Number(e.amountCents||0)/100).toFixed(2),e.notes||''])];
   const csv='\uFEFF'+rows.map(row=>row.map(q).join(',')).join('\r\n');
   const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=mk('a');
   a.href=url;a.download='rabbitry-expenses-'+(filter==='month'?today().slice(0,7):filter==='year'?year:'all-time')+'.csv';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  };
  controls.append(csvButton);section.append(controls);
  section.append(mk('h4','Expenses in report: '+money(total)));
  const byCategory=new Map(),byMonth=new Map();
  selected.forEach(e=>{const n=Number.isSafeInteger(e.amountCents)?e.amountCents:0;byCategory.set(e.category||'Other',(byCategory.get(e.category||'Other')||0)+n);const month=validDate(e.date)?e.date.slice(0,7):'Undated';byMonth.set(month,(byMonth.get(month)||0)+n)});
  function summary(title,items){section.append(mk('h4',title));if(!items.length){section.append(mk('p','No expenses for this period.'));return}const wrap=mk('div');wrap.style.overflowX='auto';const table=mk('table');table.style.width='100%';const head=mk('tr');['Group','Amount'].forEach(t=>head.append(mk('th',t)));table.append(head);items.forEach(([k,n])=>{const tr=mk('tr');[k,money(n)].forEach(v=>{const td=mk('td',v);td.style.padding='6px';tr.append(td)});table.append(tr)});wrap.append(table);section.append(wrap)}
  summary('Expenses by category',[...byCategory].sort((a,b)=>b[1]-a[1]));
  summary('Expenses by month',[...byMonth].sort((a,b)=>b[0].localeCompare(a[0])));
  section.append(mk('h4','Expense records'));
  if(!selected.length)section.append(mk('p','No expenses recorded for this period.'));
  else{
   const wrap=mk('div');wrap.style.overflowX='auto';const table=mk('table');table.style.width='100%';const head=mk('tr');['Date','Category','Amount','Notes','Actions'].forEach(t=>head.append(mk('th',t)));table.append(head);
   selected.forEach(entry=>{
    const tr=mk('tr');
    [entry.date||'',entry.category||'',money(entry.amountCents||0),entry.notes||''].forEach(t=>{const td=mk('td',t);td.style.padding='8px';tr.append(td)});
    const actions=mk('td'),edit=mk('button','Edit'),del=mk('button','Delete');edit.type='button';del.type='button';
    edit.onclick=()=>{editing=entry.id;window.render();const updated=document.getElementById('tw-step239-expenses');if(updated){updated.scrollIntoView({behavior:'smooth',block:'start'});const first=updated.querySelector('form input');if(first)first.focus({preventScroll:true});}};
    del.onclick=()=>{if(!confirm('Delete this expense record?'))return;const old=db.expenses;db.expenses=entries().filter(x=>x.id!==entry.id);try{save();if(editing===entry.id)editing=null;window.render()}catch(err){db.expenses=old;alert('Unable to delete expense.')}};
    actions.append(edit,document.createTextNode(' '),del);tr.append(actions);table.append(tr);
   });wrap.append(table);section.append(wrap)
  }
  const pl=root.querySelector('#tw-step233-pl');if(pl)pl.insertAdjacentElement('afterend',section);else root.append(section);
 }
 window.render=function(){const result=prior.apply(this,arguments);try{draw()}catch(e){console.error('Financial expense report error',e)}return result};
 try{draw()}catch(e){console.error('Financial expense report error',e)}
})();
</script>
<script id="tw-step241-remember-current-tab">
(function(){
  const key='tangled-woods-last-tab';
  function remember(tab){try{if(options.includes(tab))sessionStorage.setItem(key,tab)}catch(e){}}
  try{
    const last=sessionStorage.getItem(key);
    if(last&&options.includes(last)){
      page=last;
      window.render();
    }
  }catch(e){}
  const originalNav=window.nav;
  if(typeof originalNav==='function'){
    window.nav=function(tab){
      const result=originalNav.apply(this,arguments);
      remember(tab);
      return result;
    };
  }
  remember(page);
})();
</script>
